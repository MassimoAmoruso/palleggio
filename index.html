<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2142">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com https://cdnjs.cloudflare.com; worker-src blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palleggio">
<title>Palleggio gestionale</title>
<script>
/* tema scelto su questo dispositivo (Automatico, Chiaro, Scuro), applicato prima di disegnare per evitare il lampo */
try{var tm=localStorage.getItem('palleggio-tema');if(tm)document.documentElement.setAttribute('data-theme',tm)}catch(e){}
/* qualsiasi errore JavaScript viene mostrato nella pagina invece di lasciarla bianca */
window.addEventListener('error',function(e){var m=document.getElementById('main');if(!m)return;document.body.className='boot';
  var src=(window.APP_SRC||'').split('\n')[e.lineno-1]||'';
  m.innerHTML='<div class="splash"><h2>Errore nell\'app</h2><p></p><pre style="white-space:pre-wrap;text-align:left;font-size:12px"></pre></div>';
  m.querySelector('p').textContent=(e.message||'Errore')+(e.lineno?' (riga '+e.lineno+', colonna '+e.colno+')':'');
  m.querySelector('pre').textContent=src.slice(Math.max(0,(e.colno||0)-80),(e.colno||0)+80)});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sidebar (ball-blue + ball-yellow brand), work area of tables and panels; on phones a top bar, a bottom tab bar and tables as cards */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF1F7; --ink:#0F1C2E; --muted:#5A6A80; --line:#DCE3EE;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E3EAFC; --ball:#F4C20D; --ball-ink:#1A1400;
  --side:#0F2142; --side-ink:#B9C7DF; --side-hi:#FFFFFF; --side-line:#1F335A;
  --ok:#17804F; --ok-soft:#E0F2E9; --warn:#93600A; --warn-soft:#FBEFD6; --crit:#C2352B; --crit-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(15,28,46,.05),0 6px 20px rgba(15,28,46,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B121C; --surface:#121C29; --surface-2:#182435; --ink:#E5ECF5; --muted:#95A5BA; --line:#25344A;
  --accent:#7398FF; --accent-ink:#0B121C; --accent-soft:#1B2A4A; --ball:#F4C20D; --ball-ink:#1A1400;
  --side:#070D16; --side-ink:#97A8C2; --side-hi:#FFFFFF; --side-line:#18243A;
  --ok:#4CC38A; --ok-soft:#12301F; --warn:#E8B04B; --warn-soft:#33270E; --crit:#F2705F; --crit-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B121C; --surface:#121C29; --surface-2:#182435; --ink:#E5ECF5; --muted:#95A5BA; --line:#25344A;
  --accent:#7398FF; --accent-ink:#0B121C; --accent-soft:#1B2A4A; --ball:#F4C20D; --ball-ink:#1A1400;
  --side:#070D16; --side-ink:#97A8C2; --side-hi:#FFFFFF; --side-line:#18243A;
  --ok:#4CC38A; --ok-soft:#12301F; --warn:#E8B04B; --warn-soft:#33270E; --crit:#F2705F; --crit-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;color:var(--side-hi);line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink);margin-top:3px}
.club{all:unset;cursor:pointer;border:1px solid var(--side-line);border-radius:8px;padding:10px 12px;font-size:12px}
.club:hover{border-color:var(--side-ink)}
.club:focus-visible{outline:2px solid var(--ball)}
.club strong{display:block;color:var(--side-hi);font-size:13px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:14px;color:var(--side-ink)}
.side nav button:hover{background:var(--side-line);color:var(--side-hi)}
.side nav button.on{background:var(--side-hi);color:var(--side);font-weight:600}
.side nav button:focus-visible{outline:2px solid var(--ball)}
.side nav svg{width:18px;height:18px;flex:none}
.side nav .cnt{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;opacity:.75}
.side nav .cnt.alert{background:var(--crit);color:#fff;opacity:1;border-radius:10px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;display:flex;flex-direction:column;gap:8px}
.side-foot button{all:unset;cursor:pointer;color:var(--side-ink);text-decoration:underline;text-underline-offset:3px}
.side-foot button.confirm{color:var(--ball);font-weight:600}

main{padding:22px clamp(16px,3vw,36px) 48px;min-width:0}
.demo{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.demo i{width:8px;height:8px;border-radius:50%;background:var(--ball);display:inline-block}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:36px;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;letter-spacing:.01em}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn.danger.confirm{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn svg{width:15px;height:15px}
.ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;text-decoration:none}
.ico:hover{color:var(--accent);border-color:var(--accent)}
.ico.wa:hover{color:#1FA855;border-color:#1FA855}
.ico svg{width:15px;height:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.grid2>*{min-width:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi .val.crit{color:var(--crit)} .kpi .val.warn{color:var(--warn)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea,.inline input,.inline select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
.filters input[type=search]{width:min(280px,100%)}
.filters .sp{flex:1}
.count{color:var(--muted);font-size:13px}

.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.bad td{background:var(--crit-soft)}
tr.bad:hover td{background:var(--crit-soft)!important}
td .who{font-weight:600}
td .meta{font-size:12px;color:var(--muted)}
.contacts{display:flex;gap:6px;align-items:center}
.nowrap{white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.role{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.role.r-arbitro{background:var(--ball);color:var(--ball-ink)}
.role.r-segnapunti{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.role.r-seg{background:var(--ok-soft);color:var(--ok)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:180px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

.conf{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.conf:last-child{border-bottom:0}
.conf .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conf .when{font-family:var(--f-display);font-weight:600;font-size:17px}
.conf .people{font-size:13px;color:var(--muted)}
.conf .people b{color:var(--ink);font-weight:600}
.vs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.team-h{padding:14px 16px 10px;display:flex;gap:12px;align-items:flex-start}
.badge{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;flex:none;letter-spacing:.02em}
.team-h h2{font-size:20px;line-height:1.1}
.team-h .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.team dl{margin:0;padding:6px 16px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.team dt{color:var(--muted)}
.team dd{margin:0;font-weight:500;min-width:0}
.team-f{margin-top:auto;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.team-f .stat{font-size:12.5px;color:var(--muted);margin-right:auto}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .tick{display:inline-block;width:1em;margin-right:4px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.wk-wrap{overflow-x:auto}
.wk{display:grid;min-width:780px}
.wk .dh{font-family:var(--f-display);font-weight:600;font-size:16px;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.wk .tcol{position:relative;border-right:1px solid var(--line)}
.wk .tl{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk .day{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.wk .day:last-child{border-right:0}
.wk .gh{display:flex;margin-top:4px;font-family:var(--f-body);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.wk .gh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .gsep{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.slot small{display:block;font-size:10.5px;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{position:absolute;border-radius:6px;padding:4px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;color:#fff;border:2px solid transparent;text-align:left}
.slot b{display:block;font-size:12px}
.slot.match{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.wk .dh small{color:var(--muted);font-family:var(--f-body);font-size:11.5px;font-weight:500}
.wk .dh.today{color:var(--accent)} .wk .day.today{background-color:var(--accent-soft)}
.wknav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wknav b{font-size:13px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;align-items:center;border-top:1px solid var(--line)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:16px;height:12px;border-radius:3px;display:inline-block;background:var(--muted)}
.legend .lg-match{background:var(--muted) repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.wl-slot.match i{background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.4) 0 4px,transparent 4px 8px)}
.linkbtn{all:unset;cursor:pointer;display:block;color:var(--accent)}
.linkbtn:hover{text-decoration:underline}
.slot.bad{border-color:var(--crit);box-shadow:0 0 0 2px var(--surface) inset}
.slot.bad::after{content:"!";position:absolute;top:3px;right:5px;background:var(--crit);color:#fff;border-radius:50%;width:15px;height:15px;font-size:11px;font-weight:700;display:grid;place-items:center}

.inline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px}
.inline label{display:inline-flex;gap:6px;align-items:center}
.inline input[type=number]{width:72px}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;color:var(--muted);max-width:56ch}
.paste{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px;margin:12px 0}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;margin:10px 0}
.summary b{font-variant-numeric:tabular-nums}

.progress{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok)}

.com{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
.com textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);resize:vertical}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.hint{font-size:12.5px;color:var(--muted)}
.copybox{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;word-break:break-all;max-height:84px;overflow:auto;user-select:all}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(6,12,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dform{display:flex;flex-direction:column;flex:1;min-height:0}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.drawer-h h2{font-size:24px}
.drawer-b{flex:1;overflow:auto;padding:16px 20px}
.drawer-f{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer-f .left{margin-right:auto}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center;padding:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{color:var(--ink);font-size:14px;width:100%}
.field.wide{grid-column:1/-1}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.notice{margin-bottom:12px;border-color:var(--accent)}
.notice .panel-b{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.btn.pri-soft{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.pays{font-size:13px;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.pays div{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line);gap:10px}
.pays div:last-child{border-bottom:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* stato del salvataggio, menu, schermate di avvio */
.side .club{display:block}
.side-foot a{color:var(--side-hi)}
.side-foot .user{overflow-wrap:anywhere;opacity:.85}

.tm .check{flex:1;min-width:0}

/* tabelle come schede: le intestazioni diventano etichette dentro ogni scheda */
@media (max-width:720px){
  .tw{background:none;border:0;border-radius:0;overflow:visible}
  .tw table,.tw tbody,.tw tr,.tw td{display:block}
  .tw thead{display:none}
  .tw tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .tw td{border:0;padding:0;min-width:0;overflow-wrap:anywhere}
  .tw td:first-child,.tw td.full,.tw td.act{grid-column:1/-1}
  .tw td[data-l="Dati letti"],.tw td[data-l="Note"]{grid-column:1/-1}
  .tw td:first-child .who{font-size:16px}
  .tw td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
  .tw td.act .contacts{flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
  .tw tbody tr.click:hover td{background:none}
  .tw tbody tr.click:active{background:var(--surface-2)}
  .tw tr.bad{border-color:var(--crit);background:var(--crit-soft)}
  .tw tr.bad td,.tw tr.bad:hover td{background:none!important}
  .tw tr:has(td.full){display:block}
  .tw .nowrap{white-space:normal}
}

.sp-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.sp-note .pill{font-size:11px}

.ign{opacity:.75}
.ign-info{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.ign-list{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

/* scout: pulsanti grandi, pensati per il telefono a bordo campo */
.sc{display:grid;gap:12px;max-width:760px}
.sc-top{display:flex;align-items:center;gap:10px}
.sc-top .grow{flex:1;min-width:0}
.sc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--side);color:var(--side-hi);border-radius:12px;padding:10px 14px}
.sc-side{text-align:center;position:relative}
.sc-side small{display:block;font-size:12px;color:var(--side-ink);text-transform:uppercase;letter-spacing:.08em}
.sc-side b{font-family:var(--f-display);font-size:52px;line-height:1}
.sc-side.srv small::after{content:" ●";color:var(--ball)}
.sc-mid{display:grid;text-align:center;font-size:12px;color:var(--side-ink);gap:2px}
.sc-mid b{font-family:var(--f-display);font-size:24px;color:var(--side-hi)}
.sc-over{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.sc-court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(var(--accent-soft),var(--accent-soft)) 0 0/100% 50% no-repeat;border:2px solid var(--line);border-top:4px solid var(--ink);border-radius:8px;padding:8px}
.sc-pick{background:none}
.sc-p{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:10px 4px;border-radius:10px;background:var(--surface);border:2px solid var(--line);min-height:64px;text-align:center}
.sc-p b{font-family:var(--f-display);font-size:28px;line-height:1}
.sc-p span{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-p.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sc-p.on span{color:var(--accent-ink)}
.sc-p.srv{box-shadow:0 0 0 3px var(--ball)}
.sc-p.lib{background:var(--warn-soft)}
.sc-p.sm{min-height:0;padding:6px 10px;display:inline-grid}
.sc-p.sm b{font-size:18px}
.sc-p:disabled{cursor:default}
.sc-bench{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sc-eval{border:2px solid var(--accent);border-radius:10px;padding:8px;display:grid;gap:6px;background:var(--surface)}
.sc-evh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sc-row{display:grid;grid-template-columns:84px repeat(6,1fr);gap:5px;align-items:center;font-size:13px;font-weight:600;border-radius:6px;padding:2px}
.sc-row.hint{background:var(--accent-soft)}
.sc-v{all:unset;cursor:pointer;text-align:center;display:grid;gap:1px;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.sc-v b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.sc-v small{font-size:10px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.sc-v.v0{background:var(--ok);color:#fff}.sc-v.v1{background:var(--ok-soft);color:var(--ok)}.sc-v.v3{background:var(--warn-soft);color:var(--warn)}.sc-v.v4{background:var(--crit-soft);color:var(--crit)}.sc-v.v5{background:var(--crit);color:#fff}
.sc-quick{display:flex;flex-wrap:wrap;gap:8px}
.sc-quick .btn{flex:1 1 30%;justify-content:center;padding:12px 8px}
.sc-plus{background:var(--ok);color:#fff;border-color:var(--ok)}.sc-minus{background:var(--crit);color:#fff;border-color:var(--crit)}
.sc-help{margin:0}
.sc-log .li{padding:7px 14px;font-size:13px}
.sc-tw{overflow-x:auto}
.sc-tab{font-size:12.5px}
.sc-tab th,.sc-tab td{padding:5px 6px;text-align:center}
.sc-tab td:first-child,.sc-tab th:first-child{text-align:left;white-space:nowrap}
.sc-tab tfoot td{font-weight:700;border-top:2px solid var(--line)}
.sc-roster{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
@media print{.app,#scrim,.drawer-h,.drawer-f,.toast,.sc-rep .actions{display:none!important}.drawer{position:static;width:auto;box-shadow:none}.drawer-b{overflow:visible}body{background:#fff}}

.sc-mode{margin:0}
.sc-p{position:relative}
.sc-tag{position:absolute;top:4px;right:6px;font-style:normal;font-size:11px;font-weight:700;background:var(--ball);color:var(--ball-ink);border-radius:4px;padding:0 4px}

.sc-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sc-dirt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sc-dir{border:2px solid var(--accent);border-radius:10px;padding:8px;display:grid;gap:8px;background:var(--surface)}
.sc-from{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sc-field{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--ok-soft);border:2px solid var(--ink);border-bottom-width:5px;border-radius:6px 6px 0 0;padding:4px;max-width:360px;width:100%;justify-self:center}
.sc-z{all:unset;cursor:pointer;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:700;padding:14px 0;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.sc-z:active,.sc-z.on{background:var(--accent);color:var(--accent-ink)}
.sc-z.sm{font-size:16px;padding:6px 12px}
.sc-net{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:-4px}
.sc-dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.sc-dist h4{margin:0 0 4px;font-size:12.5px}
.sc-dirbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
.sc-dirbar .seg{margin:0}
.sc-court-wrap{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:12px;align-items:start}
.sc-svg{width:100%;max-width:200px}
.sc-svg .bg{fill:var(--surface-2);stroke:var(--ink);stroke-width:2}
.sc-svg .z{fill:var(--accent)}
.sc-svg .zl{font-size:9px;fill:var(--muted)}
.sc-svg .zc{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.sc-svg .g{stroke:var(--line);stroke-width:1}
.sc-svg .net{stroke:var(--ink);stroke-width:4}
.sc-svg .a{stroke-width:1.6;opacity:.7}
.sc-svg .a.ok,.sc-svg .m.ok{stroke:var(--ok);fill:var(--ok)}.sc-svg .a.ko,.sc-svg .m.ko{stroke:var(--crit);fill:var(--crit)}.sc-svg .a.mid,.sc-svg .m.mid{stroke:var(--muted);fill:var(--muted)}
.lg{font-weight:600}.lg.ok{color:var(--ok)}.lg.ko{color:var(--crit)}.lg.mid{color:var(--muted)}
@media (max-width:520px){.sc-court-wrap{grid-template-columns:1fr}}

/* scout: controllo della registrazione, avversari, obiettivi */
.sc-lock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;margin:8px 0;border-radius:10px;background:color-mix(in srgb,var(--warn,#c80) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn,#c80) 40%,transparent)}

.g-ok{color:var(--ok,#1a7f37);font-weight:600}.g-ko{color:var(--crit,#c33);font-weight:600}
.spark{width:100%;max-width:90px;height:24px}.spark rect{fill:var(--muted,#999)}.spark rect.ok{fill:var(--ok,#1a7f37)}.spark rect.ko{fill:var(--crit,#c33)}
.sc-tab tr.click{cursor:pointer}

/* tasse gara e spostamenti gratuiti */
.tx-li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sp-free{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}
/* scelta della gara nelle schede di conflitto */
.pick-m{display:grid;gap:4px;margin-bottom:12px}
.pick-m .seg{margin:0}
.pick-m .seg button{display:inline-flex;align-items:center;gap:6px}
/* comunicazioni ai gruppi WhatsApp della squadra */
.gr-h{background:var(--surface-2)}
.gr-li{padding-left:28px}
/* area richieste di spostamento */
.rq-li{align-items:flex-start}
.rq-li>input[type=checkbox]{margin-top:4px;width:18px;height:18px}
.rq-on{background:var(--accent-soft)}
.rq-li .actions{align-items:center}
.rq-li .meta{font-size:12.5px;color:var(--muted)}
.rq-li .meta b{color:var(--ink)}
/* partite FIPAV: barra degli strumenti (import, recapiti, regole) */
.ptools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-bottom:16px}
.ptool{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ptool b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ptool b i{font-style:normal;color:var(--muted)}
.ptool span{font-size:12.5px;color:var(--muted)}
.ptool:hover{border-color:var(--accent)}
.ptool.on{border-color:var(--accent);background:var(--accent-soft)}
.ptool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* spostamento richiesto: bordo e etichetta in evidenza su conflitti e calendario */
.panel-h>h2+.pill,.panel-h>.ph-sp{margin-left:auto}
.conf.has-sp,.list .li.has-sp{box-shadow:inset 3px 0 0 var(--warn)}
.tw tr.has-sp td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.sp-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;white-space:nowrap}
.sp-tag b{font-weight:600}
.sp-tag svg{width:13px;height:13px;flex:none}
/* calendario sul telefono */
.cal-how{margin:0 0 10px;padding-left:18px;display:grid;gap:6px;font-size:13.5px}
.cal-h{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:15px}
.cal-list{border:1px solid var(--line);border-radius:10px}
.cal-li{flex-wrap:wrap}
.cal-li .actions{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- nuova interfaccia: menu a gruppi, tema, istruzioni a richiesta ---------- */
.side nav{gap:12px}
.ngrp{display:flex;flex-direction:column;gap:2px}
.ngrp>b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:0 10px 3px;color:var(--side-ink);opacity:.7}
.tema{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tema button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 6px;font-size:13px;font-weight:500}
.tema button+button{border-left:1px solid var(--line)}
.tema button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tema button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.side .tema{background:transparent;border-color:var(--side-line)}
.side .tema button{padding:5px 4px;font-size:11.5px;color:var(--side-ink)}
.side .tema button+button{border-color:var(--side-line)}
.side .tema button[aria-pressed="true"]{background:var(--side-line);color:var(--side-hi)}
.h1row{display:flex;align-items:center;gap:10px}
.qbtn{all:unset;cursor:pointer;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface)}
.qbtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.qbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-h.first{margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sovrapposizioni: motivo, due impegni, un solo «Risolvi» */
.cn{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.cn:last-child{border-bottom:0}
.list>.cn{border-bottom:1px solid var(--line)}
.cn .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cn .when{font-family:var(--f-display);font-weight:600;font-size:18px}
.cn .why{font-size:13.5px}
.cn .why b{font-weight:600}
.cn .g{display:grid;gap:4px}
.cn .vs-m{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;margin:0;padding:4px 6px;font-size:13.5px;border-radius:6px}
.cn .vs-m .o{font-weight:600}
.cn .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cn.has-sp{box-shadow:inset 3px 0 0 var(--warn)}
.rsv{position:relative}
.rsv>summary{list-style:none;cursor:pointer}
.rsv>summary::-webkit-details-marker{display:none}
.rsv-m{position:absolute;right:0;bottom:calc(100% + 6px);z-index:6;width:min(300px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(15,28,46,.05),0 10px 30px rgba(15,28,46,.14);overflow:hidden}
.rsv-m button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:1px;width:100%;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.rsv-m button:last-child{border-bottom:0}
.rsv-m button b{font-weight:600}
.rsv-m button span{font-size:12px;color:var(--muted)}
.rsv-m button:hover,.rsv-m button:focus-visible{background:var(--surface-2)}

/* ricerca unica */
.gbar{margin-bottom:16px}
.gsearch{position:relative;max-width:560px}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px 9px 36px}
.gs-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid}
.gs-ic svg{width:17px;height:17px}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(15,28,46,.14);z-index:8;overflow:hidden}
.gres button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:baseline;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.gres button:last-child{border-bottom:0}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.gres .k{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:68px;flex:none}
.gres .gt{min-width:0}
.gres .meta{font-size:12px;color:var(--muted)}
.gnone{padding:12px;color:var(--muted);font-size:13px}
.drawer .gsearch{max-width:none}
.drawer .gres{position:static;box-shadow:none;margin-top:8px}

/* pagina Da fare */
.home{display:grid;gap:16px;max-width:1100px}
.hello h1{font-size:32px}
.hello p{margin:4px 0 0;color:var(--muted)}
.minik{display:flex;flex-wrap:wrap;gap:8px}
.minik button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.minik button:hover{border-color:var(--accent)}
.minik button:focus-visible{outline:2px solid var(--accent)}
.minik b{font-family:var(--f-display);font-size:19px;color:var(--ink);margin-right:5px}
.td-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.td-row:last-child{border-bottom:0}
.td-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.td-ic svg{width:16px;height:16px}
.td-ic.crit{background:var(--crit-soft);color:var(--crit)}.td-ic.warn{background:var(--warn-soft);color:var(--warn)}
.td-ic.ok{background:var(--ok-soft);color:var(--ok)}.td-ic.info{background:var(--accent-soft);color:var(--accent)}
.td-tx{flex:1;min-width:0}
.td-tx b{display:block;font-size:14.5px}
.td-tx span{font-size:12.5px;color:var(--muted)}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.ev .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ev .when{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.ev .what{font-size:13.5px}
.ev .where{font-size:12.5px;color:var(--muted)}
.ev .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ag-r{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:110px auto minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.ag-r:last-child{border-bottom:0}
.ag-r:hover{background:var(--surface-2)}
.ag-r:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ag-r .d{font-weight:600}
.ag-r small{display:block;color:var(--muted);font-size:12px}

/* elenco atleti compatto (telefono) */
.ph{display:none}
.fchips{gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 2px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;background:var(--surface)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 2px 8px}
.dlegend i,.dots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dlegend i{margin-right:5px;vertical-align:-1px}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-crit{background:var(--crit)}.d-mute{background:var(--line)}
.arow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;width:100%;padding:10px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow:active{background:var(--surface-2)}
.arow .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .sub{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:12px;align-items:center}
.dots>span{display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--muted)}

/* messaggio con Annulla */
.toast{display:flex;align-items:center;gap:14px}
.toast button{all:unset;cursor:pointer;font-weight:700;color:var(--ball)}
.toast button:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

/* lente nella barra del telefono */
.tb-r{display:flex;align-items:center;gap:8px;flex:none}
.tb-search{all:unset;cursor:pointer;width:36px;height:36px;border-radius:8px;border:1px solid var(--side-line);display:grid;place-items:center;color:var(--side-hi)}
.tb-search svg{width:18px;height:18px}
.tb-search:focus-visible{outline:2px solid var(--ball)}

@media (max-width:860px){
  /* la barra in alto non deve allargare la pagina oltre lo schermo */
  .app{grid-template-columns:minmax(0,1fr)}
  .tb-club{flex:1 1 auto}
  .topbar .sync span{max-width:96px;overflow:hidden;text-overflow:ellipsis}
  .gbar{display:none}
  .hello h1{font-size:26px}
  .ag-r{grid-template-columns:auto minmax(0,1fr);padding:10px 14px}
  .ag-r .d{grid-column:1/-1}
  .td-row{padding:11px 14px}
  .td-row{gap:10px}
  .td-ic{width:28px;height:28px}
}
@media (max-width:720px){
  .ph{display:block}
  .fchips.ph{display:flex}
  .ath-tw,#fa_flag{display:none}
}

/* vecchia pagina di Google: invito al nuovo indirizzo */
.moved,.splash .moved{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink)!important;font-size:14px;border:1px solid var(--accent)}
.moved a{font-weight:600;overflow-wrap:anywhere}
</style>

<script>
var PALLEGGIO_CFG={"sito": "https://massimoamoruso.github.io/palleggio/", "api": "https://script.google.com/macros/s/AKfycbwM3TI5fRvy3ic0jj-Jm2XYsu7B-JpQGu2zMN-EYzPGc9UEc4dUo7i6Tr3OiYIFveag8A/exec"};

   - dirigente: email della scheda dirigente, squadre seguite
   - genitore: email di uno dei genitori nella scheda atleta (o della scheda dirigente o staff collegata); atleta: email propria
   - segreteria: indicata in "Accessi" (anche più persone, per tutte le squadre o solo alcune):
     vede tutte le gare, modifica quelle delle squadre di competenza e ne approva gli spostamenti.
     Le versioni precedenti avevano un solo riferimento nei dati della società (club.segreteria): vale ancora,

var PERM_TEC = ['allenatore', 'secondo'];
var PERM_NO_LIM = ['cf', 'indirizzo', 'luogo', 'quota']; /* dati che gli allenatori non ricevono */
var PERM_NO_DIR = ['quota']; /* dati che i dirigenti non ricevono: gestiscono l'anagrafica delle atlete, non le quote */
function permLc(s) { return String(s || '').trim().toLowerCase(); }
function permHas(a, b) { a = a || []; for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) return true; return false; }
function permUniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
/* genitori dell'atleta: elenco `genitori`; le schede salvate prima avevano un solo `genitore` */
function permParents(a) {

}
/* l'allenatore può cambiare solo i numeri di maglia delle sue squadre */
function permMaglieOk(cur, next, T) {

}

function profileFor(email, D, owner) {

  var teams = D.teams || [], sigla = function (id) { var t = teams.filter(function (x) { return x.id === id; })[0]; return t ? t.sigla : ''; };

    if (u.ruolo === 'giovanile') { P.giov = true; if (!(u.teams || []).length) P.giovAll = true; else P.giovTeams = P.giovTeams.concat(u.teams); }
    if (u.ruolo === 'segreteria') { P.segr = true; if (!(u.teams || []).length) P.segrAll = true; else P.segrTeams = P.segrTeams.concat(u.teams); }
  });
  if (P.giovAll) teams.forEach(function (t) { if (t.giovanile) P.giovTeams.push(t.id); });
  (D.staff || []).forEach(function (s) {
    if (permLc(s.email) !== e) return;
    P.staffIds.push(s.id); if (!P.nome) P.nome = s.nome + ' ' + s.cognome;
    teams.forEach(function (t) { var st = t.staff || {}; Object.keys(st).forEach(function (r) { if (st[r] !== s.id) return; P.staffTeams.push(t.id); if (PERM_TEC.indexOf(r) >= 0) P.coachTeams.push(t.id); }); });
  });
  (D.dirigenti || []).forEach(function (d) {
    if (permLc(d.email) !== e) return;
    P.dirIds.push(d.id); if (!P.nome) P.nome = d.nome + ' ' + d.cognome;
    P.dirTeams = P.dirTeams.concat(d.teams || []);
  });
  var kids = [];
  (D.athletes || []).forEach(function (a) {
    var self = permLc(a.email) === e;
    var g = permParents(a).filter(function (x) { return permLc(x.email) === e || (x.dirId && P.dirIds.indexOf(x.dirId) >= 0) || (x.staffId && P.staffIds.indexOf(x.staffId) >= 0); })[0];
    if (self || g) {

      if (!P.nome && self) P.nome = a.nome + ' ' + a.cognome;

  });

      var g = icsFind(D.gyms, function (x) { return x.id === s.gymId; });
      out.push({ uid: s.id, summary: (t.sigla || '') + ' · Allenamento', d: first, t: s.inizio, dur: Math.max(15, icsMin(s.fine) - icsMin(s.inizio)),
        rrule: 'FREQ=WEEKLY;BYDAY=' + ICS_DAYS[s.giorno] + ';UNTIL=' + icsDay(se.a) + 'T215959Z',
        location: g ? [g.nome, g.indirizzo].filter(function (x) { return x; }).join(', ') : '',
        desc: (t.nome || '') + ' · allenamento ' + s.inizio + '–' + s.fine + (g ? ' · ' + g.nome : ''), tentative: false });
    });
  } else {
    (D.matches || []).filter(function (m) { return m.teamId === f.t && m.data && icsCamp(m) === f.c; }).forEach(function (m) {
      var sp = m.spostamento && m.spostamento.stato === 'richiesta' ? m.spostamento : null, al = sp && sp.al ? sp.al : null;
      var desc = [[m.campionato, m.girone && icsN(m.campionato).indexOf(icsN(m.girone)) < 0 ? 'girone ' + m.girone : ''].filter(function (x) { return x; }).join(' · '),
        m.numero ? 'Gara n. ' + m.numero : '', m.inCasa === false ? 'In trasferta' : 'In casa',
        al && al.data ? 'Richiesto lo spostamento al ' + al.data.split('-').reverse().join('/') + (al.ora ? ' ore ' + al.ora : '') + ': in attesa di conferma, per ora vale questo orario' : ''].filter(function (x) { return x; });
      out.push({ uid: m.id, summary: (t.sigla || '') + ' · ' + (m.casa || '') + ' – ' + (m.ospite || '') + (sp ? ' (possibile spostamento)' : ''),
        d: m.data, t: m.ora || '', dur: dur, rrule: '', location: icsPlace(D, m), desc: desc.join('\n'), tentative: !!sp });
    });
  }
  return out;
}

/* il file .ics del calendario f */
function icsBuild(D, f, now) {
  var t = icsTeam(D, f.t) || {};
  var seq = Math.max(0, Math.floor((now - Date.UTC(2026, 0, 1)) / 60000)), stamp = icsUtc(now);
  var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Palleggio//Calendario squadre//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc(icsName(D, f)), 'X-WR-TIMEZONE:Europe/Rome', 'REFRESH-INTERVAL;VALUE=DURATION:PT6H', 'X-PUBLISHED-TTL:PT6H'];
  if (t.colore) L.push('X-APPLE-CALENDAR-COLOR:' + t.colore);
  L = L.concat(ICS_TZ);
  icsEvents(D, f, now).forEach(function (e) {
    L.push('BEGIN:VEVENT', 'UID:' + e.uid + '@palleggio', 'DTSTAMP:' + stamp, 'SEQUENCE:' + seq, 'SUMMARY:' + icsEsc(e.summary));
    if (e.t) L.push('DTSTART;TZID=Europe/Rome:' + icsLocal(e.d, e.t), 'DTEND;TZID=Europe/Rome:' + icsLocal(e.d, e.t, e.dur));
    else L.push('DTSTART;VALUE=DATE:' + icsDay(e.d), 'DTEND;VALUE=DATE:' + icsDay(e.d, 1));
    if (e.rrule) L.push('RRULE:' + e.rrule);
    L.push('LOCATION:' + icsEsc(e.location), 'DESCRIPTION:' + icsEsc(e.desc), 'STATUS:' + (e.tentative ? 'TENTATIVE' : 'CONFIRMED'), 'TRANSP:OPAQUE', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

function buildImport(rows){
  let h=0;for(let i=0;i<Math.min(rows.length,15);i++){const j=rows[i].map(c=>String(c).toLowerCase()).join('|');if(/data/.test(j)&&/(casa|ospit|squadra)/.test(j)){h=i;break}}
  const header=(rows[h]||[]).map(c=>String(c).trim());
  const map={};IMPORT_FIELDS.forEach(f=>map[f[0]]=-1);
  header.forEach((c,i)=>{const l=c.toLowerCase();const f=IMPORT_FIELDS.find(f=>map[f[0]]<0&&f[2].test(l));if(f)map[f[0]]=i});
  return{header,map,body:rows.slice(h+1).filter(r=>r.some(c=>String(c).trim()!==''))};
}
function cellDate(v){
  if(v instanceof Date)return{date:iso(v),time:null};
  if(typeof v==='number'&&v>20000){const ms=Math.round((v-25569)*864e5);const d=new Date(ms);const frac=v%1;
    return{date:`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`,time:frac>0.0001?m2t(Math.round(frac*1440)%1440):null}}
  const s=String(v||'');let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2})[:.](\d{2}))?/);
  if(m)return{date:`${m[1]}-${pad(m[2])}-${pad(m[3])}`,time:m[4]?pad(m[4])+':'+m[5]:null};
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\D+(\d{1,2})[:.](\d{2}))?/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return{date:`${y}-${pad(m[2])}-${pad(m[1])}`,time:m[4]?pad(m[4])+':'+m[5]:null}}
  return null;
}
function cellTime(v){
  if(v instanceof Date)return pad(v.getHours())+':'+pad(v.getMinutes());
  if(typeof v==='number'&&v<1)return m2t(Math.round(v*1440)%1440);
  const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m?pad(m[1])+':'+m[2]:'';
}
function associate(teams,casa,ospite){
  const nc=norm(casa),no=norm(ospite);
  for(const t of teams){const f=norm(t.fipav);if(!f)continue;if(f===nc)return{team:t,home:true};if(f===no)return{team:t,home:false}}
  let best=null;for(const t of teams){const f=norm(t.fipav);if(!f)continue;
    if(nc.includes(f)&&(!best||f.length>norm(best.team.fipav).length))best={team:t,home:true};
    if(no.includes(f)&&(!best||f.length>norm(best.team.fipav).length))best={team:t,home:false}}
  return best;
}
function parseImport(imp,teams){
  return imp.body.map(r=>{const g=f=>imp.map[f]>=0?r[imp.map[f]]:'';const dt=cellDate(g('data'));
    const casa=String(g('casa')).trim(),ospite=String(g('ospite')).trim(),a=associate(teams,casa,ospite);
    return{numero:String(g('numero')).trim(),campionato:String(g('campionato')).trim(),girone:String(g('girone')).trim()||(String(g('campionato')).match(/\bgir(?:one)?\.?\s*([a-z0-9]+)/i)?.[1]||''),data:dt?.date||'',ora:cellTime(g('ora'))||dt?.time||'',casa,ospite,impianto:String(g('impianto')).trim(),teamId:a?.team.id||null,inCasa:a?a.home:null}});

function applyImport(st,parsed,mode){
  const ok=parsed.filter(p=>p.teamId&&p.data),key=m=>m.numero||(m.data+norm(m.casa)+norm(m.ospite)),old=st.matches;
  /* "sostituisci" tiene le gare inserite a mano; i campi modificati a mano (lock) non vengono sovrascritti */
  if(mode==='replace')st.matches=old.filter(m=>m.origine==='manuale');
  let add=0,upd=0;
  for(const p of ok){const ex=old.find(m=>key(m)===key(p));
    if(ex){const q={...p};(ex.lock||[]).forEach(f=>delete q[f]);Object.assign(ex,q);if(!st.matches.includes(ex))st.matches.push(ex);upd++}
    else{st.matches.push({id:uid('m'),...p});add++}}
  st.matches.sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
  return{add,upd};
}

const ignSig=x=>x.giorno!=null?`${x.giorno} ${x.inizio}-${x.fine} ${x.gymId||''}`:`${x.data} ${x.ora} ${norm(x.impianto||'')}`;

function matchConflicts(all=false){
  const dur=+S.settings.durata||120,mar=+S.settings.margine||0,cache={};
  const P=m=>m.staffGara?peopleOf(teamOf(m.teamId),m):cache[m.teamId]||(cache[m.teamId]=peopleOf(teamOf(m.teamId)));
  const ms=S.matches.filter(m=>m.teamId&&m.data&&m.ora&&teamOf(m.teamId)).map(m=>({m,s:absMin(m.data,m.ora)})).sort((a,b)=>a.s-b.s);
  const out=[];
  for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){
    const gap=ms[j].s-ms[i].s;if(gap>=dur+mar)break;
    const A=ms[i].m,B=ms[j].m;if(A.teamId===B.teamId)continue;
    const same=norm(A.impianto)!==''&&norm(A.impianto)===norm(B.impianto);
    let shared=[];if(gap<dur+(same?0:mar)){const kb=new Set(P(B).map(p=>p.key));shared=P(A).filter(p=>kb.has(p.key))}

/* Ogni record (atleta, squadra, gara…) è una riga del foglio con un numero di revisione.
   Si inviano solo i record cambiati rispetto all'ultima versione letta. Se nel frattempo un altro utente
   ha modificato lo stesso record, il server unisce le due modifiche quando toccano campi diversi;
   se toccano lo stesso campo vince la sua versione e l'utente viene avvisato. */
const gs=(fn,...a)=>GAS?new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...a)):gsPost(fn,a);
/* testo semplice: il browser non chiede permessi preliminari al server, che risponde dopo un rinvio a googleusercontent.com */
async function gsPost(fn,args){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),90e3);
  try{const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow',signal:ac.signal});
    if(!r.ok)throw new Error('Connessione assente');let x;try{x=await r.json()}catch(e){throw new Error('Risposta del server non valida: riprova tra poco')}
    if(!x.ok)throw new Error(x.err||'Errore sconosciuto');return x.r}
  catch(e){if(e.name==='AbortError')throw new Error('Connessione assente');throw e}finally{clearTimeout(t)}}
/* limite del server (Code.gs, MAX_JSON): un record più grande non si può salvare */
const MAX_JSON=360000;
function labelOf(c,o){if(!o)return'';switch(c){
  case'config':return o.nome||'Regole di controllo gare';
  case'athletes':return`${o.cognome} ${o.nome}`+((o.teams||[]).length?' · '+o.teams.map(id=>teamOf(id)?.sigla).filter(Boolean).join(', '):'');
  case'teams':return`${o.sigla} · ${o.nome}`;
  case'staff':case'dirigenti':return`${o.cognome} ${o.nome}`;
  case'gyms':return o.nome;
  case'slots':return`${DAYS[o.giorno]} ${o.inizio}-${o.fine} · ${teamOf(o.teamId)?.sigla||''} · ${S.gyms.find(g=>g.id===o.gymId)?.nome||''}`;
  case'matches':return`${fmtD(o.data)} ${o.ora} · ${o.casa} – ${o.ospite}`;
  case'utenti':return`${o.email} · ${o.ruolo==='admin'?'amministratore':o.ruolo==='segreteria'?'segreteria':'responsabile giovanile'}`;
  case'scout':{const m=S.matches.find(x=>x.id===o.matchId);return`Scout · ${m?`${fmtD(m.data)} ${m.casa} – ${m.ospite}`:o.matchId}`}
  case'avversari':return`${o.nome}${o.campionato?' · '+o.campionato:''}`}
  return''}
function snapshot(){const m=new Map(),put=(c,id,o)=>m.set(c+'/'+id,{c,id,o,json:JSON.stringify(o)});
  put('config','club',S.club);put('config','settings',S.settings);
  for(const c of COLLS)for(const o of S[c])put(c,o.id,o);
  return m}
/* come snapshot, solo per i record indicati ('scout/sc123'…) */
function snapOf(keys){const m=new Map();
  for(const k of keys){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1),o=localRec(c,id);if(o)m.set(k,{c,id,o,json:JSON.stringify(o)})}
  return m}
const sj=x=>JSON.stringify(x);
/* impronta veloce di un testo (FNV-1a a 32 bit): la stessa funzione è nel server (impronta_) */
function impronta(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
/* solo la parte cambiata di un testo lungo: primi p caratteri e ultimi s uguali, in mezzo mid.
   Per lo scout un'azione aggiunge poche decine di caratteri a un record di decine di KB */
function textDelta(a,b){const n=Math.min(a.length,b.length);let p=0;while(p<n&&a.charCodeAt(p)===b.charCodeAt(p))p++;
  let s=0;while(s<n-p&&a.charCodeAt(a.length-1-s)===b.charCodeAt(b.length-1-s))s++;
  /* non si divide un'emoji (coppia di caratteri) tra la parte uguale e quella cambiata */
  const hi=c=>c>=0xD800&&c<0xDC00,lo=c=>c>=0xDC00&&c<0xE000;
  if(p>0&&hi(b.charCodeAt(p-1)))p--;if(s>0&&lo(b.charCodeAt(b.length-s)))s--;
  return{p,s,mid:b.slice(p,b.length-s),n:b.length,h:impronta(b)}}
/* campi cambiati tra due versioni di un record */
const diffKeys=(a,b)=>[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>sj(a[k])!==sj(b[k]));
/* modifiche da inviare: tutti i record (snap completo) oppure solo quelli indicati in keys (snap da snapOf) */
function pendingChanges(snap=snapshot(),keys=null){const out=[];
  for(const[k,r]of snap){const b=SYNC.base.get(k);if(b&&b.json===r.json)continue;
    /* rifiutato (troppo grande o non valido) così com'è: si riprova solo se cambia */
    const sk=SYNC.skip.get(k);if(sk!==undefined){if(sk===r.json)continue;SYNC.skip.delete(k)}
    const ch={c:r.c,id:r.id,base:b?b.rev:0,json:r.json,label:labelOf(r.c,r.o)};
    /* campi cambiati e loro valore di partenza: il server li usa per unire una modifica concorrente */
    if(b&&r.c!=='scout'){let o0=null;try{o0=JSON.parse(b.json)}catch(e){}
      if(o0){ch.keys=diffKeys(o0,r.o);ch.prev={};for(const f of ch.keys)if(f in o0)ch.prev[f]=o0[f]}}
    /* scout: si invia solo la parte cambiata (il server la ricompone sul testo salvato, vedi delta_ in Code.gs) */
    if(b&&r.c==='scout'&&r.json.length>2000&&!SYNC.noDelta.has(k))ch.delta=textDelta(b.json,r.json);
    out.push(ch)}
  const del=(k,b)=>{let o=null;try{o=JSON.parse(b.json)}catch(e){}out.push({c:b.c,id:b.id,base:b.rev,json:null,label:labelOf(b.c,o)})};
  if(keys){for(const k of keys){const b=SYNC.base.get(k);if(b&&!snap.has(k))del(k,b)}}
  else for(const[k,b]of SYNC.base)if(!snap.has(k))del(k,b);

/* c'è qualcosa da salvare? Durante lo scout guarda solo i record segnati, senza confrontare tutti i dati */
const anyPending=()=>SYNC.full?pendingChanges().length>0:SYNC.dirty.size>0&&pendingChanges(snapOf(SYNC.dirty),[...SYNC.dirty]).length>0;
/* record locale (null se non c'è) */
function localRec(c,id){if(c==='config')return id==='club'?S.club:id==='settings'?S.settings:null;return(S[c]||[]).find(x=>x.id===id)||null}
/* sostituisce il record sul posto, così i riferimenti già in uso restano validi */
function applyRecord(c,id,json){let o=null;if(json!=null){try{o=JSON.parse(json)}catch(e){return}}
  const swap=(t,o)=>{for(const k of Object.keys(t))delete t[k];Object.assign(t,o)};
  if(c==='config'){const t=id==='club'?S.club:id==='settings'?S.settings:null;if(t&&o)swap(t,o);return}
  const arr=S[c];if(!arr)return;const i=arr.findIndex(x=>x.id===id);
  if(!o){if(i>=0)arr.splice(i,1);return}
  if(i>=0)swap(arr[i],o);else arr.push(o)}
/* versione del server sopra le modifiche locali fatte da `ref` in poi (mentre il salvataggio era in corso):
   i campi che l'utente ha cambiato nel frattempo restano i suoi, gli altri prendono il valore del server */
function rebaseRecord(c,id,ref,json){const loc=localRec(c,id);
  if(json==null||!loc||ref==null||sj(loc)===ref){applyRecord(c,id,json);return}
  let r=null,o=null;try{r=JSON.parse(ref);o=JSON.parse(json)}catch(e){applyRecord(c,id,json);return}
  for(const k of diffKeys(r,loc)){if(k in loc)o[k]=loc[k];else delete o[k]}
  applyRecord(c,id,sj(o))}
function setBase(c,id,rev,json){const k=c+'/'+id;if(json==null)SYNC.base.delete(k);else SYNC.base.set(k,{c,id,rev,json})}

/* modifiche non ancora salvate, conservate sul dispositivo: se l'app si chiude senza rete non vanno perse
   e al prossimo avvio (stesso utente) si riapplicano e si inviano */
const PEND_KEY='palleggio-pending';
function savePending(){if(!REMOTE||!SYNC.ready||ME?.preview)return;
  try{let ch;
    if(SYNC.full)ch=pendingChanges();
    else{/* solo i record segnati e quelli già conservati: le altre modifiche sono già state salvate */
      let old=null;try{old=JSON.parse(localStorage.getItem(PEND_KEY)||'null')}catch(e){}
      const keys=new Set(SYNC.dirty);if(old&&old.user===SYNC.user)(old.changes||[]).forEach(x=>keys.add(x.c+'/'+x.id));
      ch=keys.size?pendingChanges(snapOf(keys),[...keys]):[]}
    /* sul dispositivo il record intero, mai il delta */
    if(ch.length)localStorage.setItem(PEND_KEY,sj({user:SYNC.user,at:Date.now(),changes:ch.map(({delta,...x})=>x)}));else localStorage.removeItem(PEND_KEY)}catch(e){}}
const dropPending=()=>{try{localStorage.removeItem(PEND_KEY)}catch(e){}};
/* dopo il caricamento: riapplica le modifiche salvate sul dispositivo se il record sul server non è cambiato,
   oppure se sono cambiati solo campi diversi da quelli modificati qui */
function restorePending(){let p=null;try{p=JSON.parse(localStorage.getItem(PEND_KEY)||'null')}catch(e){}
  if(!p||!Array.isArray(p.changes))return;
  if(p.user!==SYNC.user){dropPending();return}
  let ok=0,lost=0;
  for(const ch of p.changes){const b=SYNC.base.get(ch.c+'/'+ch.id),rev=b?b.rev:0;
    if(rev===(ch.base||0)){applyRecord(ch.c,ch.id,ch.json);ok++;continue}
    const loc=localRec(ch.c,ch.id);let mine=null;try{mine=ch.json==null?null:JSON.parse(ch.json)}catch(e){}
    if(loc&&mine&&Array.isArray(ch.keys)&&ch.prev&&ch.keys.every(k=>sj(loc[k])===sj(ch.prev[k])||sj(loc[k])===sj(mine[k]))){
      const o=JSON.parse(sj(loc));for(const k of ch.keys){if(k in mine)o[k]=mine[k];else delete o[k]}applyRecord(ch.c,ch.id,sj(o));ok++}
    else lost++}
  if(ok||lost)setTimeout(()=>toast(lost?`Recuperate ${ok} modifiche non salvate; ${lost} non più applicabili perché nel frattempo altri hanno cambiato gli stessi dati`:`Recuperate ${ok} modifiche non salvate: le salvo ora`,6000),300)}

async function sync(){
  if(!REMOTE||!SYNC.ready)return;
  if(SYNC.busy){SYNC.again=true;return}
  clearTimeout(SYNC.timer);clearTimeout(SYNC.deb);
  /* eliminazione appena fatta: si aspetta che passi il tempo per annullarla */
  if(SYNC.holdUntil>Date.now()){SYNC.timer=setTimeout(sync,SYNC.holdUntil-Date.now()+50);return}
  /* confronto completo dopo save() e comunque una volta al minuto; altrimenti solo i record segnati da saveRec */
  const full=SYNC.full||Date.now()-SYNC.fullAt>60e3,keys=full?null:[...SYNC.dirty];
  SYNC.full=false;SYNC.dirty=new Set();if(full)SYNC.fullAt=Date.now();
  const putBack=()=>{if(full)SYNC.full=true;else for(const k of keys)SYNC.dirty.add(k)};
  const snap=full?snapshot():snapOf(keys),changes=pendingChanges(snap,keys);
  /* un record troppo grande non si invia: gli altri si salvano lo stesso */
  const big=changes.filter(ch=>ch.json!=null&&ch.json.length>MAX_JSON);
  for(const ch of big){SYNC.skip.set(ch.c+'/'+ch.id,ch.json);toast(`«${ch.label||'Un dato'}» è troppo grande per essere salvato sul foglio: le altre modifiche vengono salvate`,8000)}
  const send=changes.filter(ch=>!big.includes(ch));
  /* niente letture mentre la pagina è nascosta o una scheda è aperta in modifica */
  if(!send.length&&(document.hidden||!$('#drawer').hidden)){if(big.length)setSync('error');SYNC.timer=setTimeout(sync,POLL);return}
  SYNC.busy=true;if(send.length)setSync('saving');
  /* com'era ogni record prima dell'invio (base): serve a non perdere le modifiche fatte durante il salvataggio */
  const baseNow=new Map([...SYNC.base].map(([k,b])=>[k,b.json]));
  try{
    const payload=send.map(ch=>ch.delta?{c:ch.c,id:ch.id,base:ch.base,label:ch.label,delta:ch.delta}:ch);
    const res=JSON.parse(await gs('sincronizza',getToken(),sj({version:SYNC.version,epoch:SYNC.epoch,key:ME?.key,changes:payload})));
    /* dati ripristinati da un backup: si ricarica tutto (le modifiche in attesa restano sul dispositivo e si riapplicano se possibile) */
    if(res.restored){SYNC.busy=false;putBack();savePending();toast('I dati sono stati ripristinati da un backup: li ricarico',5000);boot();return}
    const sent=new Map(send.map(ch=>[ch.c+'/'+ch.id,ch]));
    /* il server restituisce il record come lo vede l'utente: se differisce da quello inviato, si allinea */
    let redraw=false,merged=null;
    for(const a of res.applied){const k=a.c+'/'+a.id;setBase(a.c,a.id,a.rev,a.json);SYNC.skip.delete(k);SYNC.noDelta.delete(k);if(a.merged&&!merged)merged=a;
      if(a.json!==sent.get(k).json){rebaseRecord(a.c,a.id,sent.get(k).json,a.json);redraw=true}}
    const lost=res.conflicts.map(r=>({...r,label:sent.get(r.c+'/'+r.id)?.label}));
    const denied=(res.denied||[]).map(r=>({...r,label:sent.get(r.c+'/'+r.id)?.label}));
    for(const r of[...res.conflicts,...denied]){setBase(r.c,r.id,r.rev,r.json);applyRecord(r.c,r.id,r.json)}
    /* modifiche degli altri: si tengono quelle fatte qui nel frattempo (record cambiato dopo la base, non ancora inviato) */
    for(const r of res.changes){const k=r.c+'/'+r.id;setBase(r.c,r.id,r.rev,r.json);rebaseRecord(r.c,r.id,baseNow.get(k)??null,r.json)}
    for(const r of res.rejected||[]){const k=r.c+'/'+r.id,ch=sent.get(k);
      /* il pezzo cambiato non si applica (record cambiato sul server): si rimanda subito il record intero */
      if(r.resend){SYNC.noDelta.add(k);SYNC.dirty.add(k);SYNC.again=true;continue}
      if(ch)SYNC.skip.set(k,ch.json);
      toast(`«${ch?.label||'Un dato'}» non è stato salvato (${r.why}): le altre modifiche sono salvate`,8000)}
    SYNC.version=res.version;SYNC.at=new Date();if(res.user)SYNC.user=res.user;
    if(redraw||res.conflicts.length||denied.length||res.changes.length){S.matches.sort(byWhen);refresh()}
    if(denied.length)toast(`Non hai i permessi per modificare «${denied[0].label||'questo dato'}»: modifica annullata`,6000);
    else if(lost.length){const r=lost[0],chi=r.da||'un altro utente';
      toast(r.json==null?`«${r.label||'Il dato'}» è stato eliminato da ${chi}: la tua modifica non è stata salvata`:`${chi} ha modificato «${r.label||'lo stesso dato'}» poco prima di te: tenuta la sua versione`,6000)}
    else if(merged)toast(`Anche ${merged.da||'un altro utente'} ha modificato «${sent.get(merged.c+'/'+merged.id)?.label||'questo dato'}»: le due modifiche sono state unite`,5000);
    const still=anyPending();
    setSync(still?'pending':SYNC.skip.size?'error':'ok',SYNC.skip.size?'Alcuni dati non si possono salvare':'');
    /* i permessi sono cambiati (es. nuova squadra assegnata): si ricarica tutto */
    if(res.reload&&!still){SYNC.busy=false;toast('I tuoi permessi sono cambiati: aggiorno i dati',4000);boot();return}
  }catch(e){if(isAuth(e)){SYNC.busy=false;logoutLocal(errMsg(e));return}putBack();setSync('error',errMsg(e))}
  finally{SYNC.busy=false;savePending();
    if(SYNC.again){SYNC.again=false;SYNC.deb=setTimeout(sync,50)}
    else SYNC.timer=setTimeout(sync,SYNC.state==='error'?10000:POLL)}
}

  return m.replace(/^(Exception|Error|Eccezione):\s*/i,'').slice(0,160)||'Errore sconosciuto'}

  for(const p of S.staff)if(hit(`${p.nome} ${p.cognome}`))out.push({k:'Staff',t:fullName(p),s:S.teams.filter(t=>Object.values(t.staff||{}).includes(p.id)).map(t=>t.sigla).join(', ')||p.qualifica||'',act:'editStaff',id:p.id,r:3});
  for(const t of S.teams)if(hit(`${t.sigla} ${t.nome} ${t.campionato||''}`))out.push({k:'Squadra',t:`${t.sigla} · ${t.nome}`,s:t.campionato||'',act:'editTeam',id:t.id,r:4});
  for(const m of S.matches)if(m.data&&hit(`${fmtDow(m.data)} ${fmtD(m.data)} ${teamOf(m.teamId)?.sigla||''} ${m.casa} ${m.ospite} ${m.numero||''}`))
    out.push({k:'Gara',t:`${fmtDow(m.data)} ${m.ora||''} ${teamOf(m.teamId)?.sigla||''}`,s:`${nomeSq(m.casa)} – ${nomeSq(m.ospite)}`,act:'editMatch',id:m.id,r:5,d:m.data});
  /* prima chi comincia con la prima parola cercata, poi per tipo; le gare dalla più vicina a oggi */
  const st=x=>fold(x.t).split(/\s+/).some(w=>w.startsWith(W[0]))?0:1;
  return out.sort((x,y)=>st(x)-st(y)||x.r-y.r||(x.d&&y.d?Math.abs(daysTo(x.d))-Math.abs(daysTo(y.d)):0)).slice(0,8)}

function searchRender(inp){const box=inp.parentElement.querySelector('.gres'),q=inp.value;UI.gq=q;

/* sovrapposizione tra due gare: prima il motivo in una riga, poi le due gare (si aprono toccandole), un solo «Risolvi» */
function confHtml(c){
  const ta=teamOf(c.a.teamId),tb=teamOf(c.b.teamId);
  const staff=c.shared.filter(p=>p.tipo!=='ath'),ath=c.shared.filter(p=>p.tipo==='ath');
  const ruoli=[...new Set(staff.map(p=>p.ruolo.split(',')[0].toLowerCase()))].map(r=>'stesso '+r);
  const parts=[...ruoli];if(ath.length)parts.push(`${ath.length} atlet${ath.length>1?'i':'a'} in comune`);if(c.venue)parts.push('stesso impianto, entrambe in casa');
  /* «Stesso allenatore e stesso dirigente: due gare a 1 h 30 di distanza (Marco Bianchi, Roberto Sala).» */
  const txt=andJoin(parts),why=`<b>${esc(txt.charAt(0).toUpperCase()+txt.slice(1))}</b>: due gare ${c.gap?`a ${gapTxt(c.gap)} di distanza`:'alla stessa ora'}${staff.length?` (${esc(staff.map(p=>p.nome).join(', '))})`:''}.`;
  const L=[c.a,c.b],E=L.filter(m=>canEdit('matches',m)),free=E.filter(m=>!spPending(m)),pend=L.filter(m=>spPending(m)&&(canEdit('matches',m)||canApprove(m))),ids=A=>A.map(m=>m.id).join('~'),sig=A=>A.map(m=>teamOf(m.teamId)?.sigla||'').join(' o ');
  const sp=L.filter(spPending);
  return`<div class="cn${c.ign?' ign':''}${sp.length?' has-sp':''}"><div class="top"><span class="when">${fmtDow(c.a.data)}</span>${pill(c.ign?'mute':'crit',c.ign?'Ignorata':'Da risolvere')}${sp.length?pill('warn',`Spostamento richiesto${sp.length<2?' · '+(teamOf(sp[0].teamId)?.sigla||''):' per entrambe'}`):''}</div>
  <div class="why">${why}</div>
  <div class="g">${[[ta,c.a],[tb,c.b]].map(([t,m])=>`<button type="button" class="vs-m" data-act="editMatch" data-id="${m.id}" title="Apri la gara">${chip(t)}<span class="num o">${esc(m.ora)}</span><span>${matchLine(m)} · ${m.inCasa===false?'trasferta':'in casa'}${spTag(m)}</span></button>`).join('')}</div>
  ${ignInfo(c)}<div class="foot"><span class="meta">Tocca una gara per aprirla</span>${c.ign?ignBtn(c):risolvi([
    staff.length&&E.length&&['matchCoach',ids(E),'Altro allenatore per una gara',`Scegli chi segue ${sig(E)} quel giorno`],
    free.length&&['spNew',ids(free),'Richiedi spostamento','Prepara la richiesta al comitato e all\'avversario'],
    ...pend.map(m=>['spView',m.id,`${canApprove(m)?'Valuta lo spostamento':'Spostamento in approvazione'} · ${teamOf(m.teamId)?.sigla||''}`,spProposta(m)]),
    ignItem(c)])}</div></div>`;
}

/* ---------- tasse gara e spostamenti gratuiti della squadra (dal comunicato FIPAV) ---------- */
/* dove si gioca: palestra della società, altrimenti impianto dell'avversario dal comunicato, altrimenti il nome del calendario */
function matchPlace(m){const g=gymOfMatch(m);if(g&&m.inCasa!==false)return{nome:g.nome,indirizzo:g.indirizzo};
  const a=m.inCasa===false?avOf(m)?.impianto:null;if(a?.nome)return a;if(g)return{nome:g.nome,indirizzo:g.indirizzo};
  return m.impianto?{nome:m.impianto,comune:m.localita||''}:null}
/* nella richiesta già inviata: è tra le gratuite? conta le richieste della squadra fatte prima di questa */
function spGratisView(m){const x=spGratisK(m);return x?`<p class="sp-free">${pill(x[0],x[1])}<span>${esc(x[2])}</span></p>`:''}
/* richieste di una gara: quelle chiuse dello storico (perm.js, permSpOk) e l'ultima */
const spList=m=>[...(m.spostStorico||[]),...(m.spostamento?[m.spostamento]:[])];
const spIl=sp=>sp.il||TODAY_ISO;
const spTeamList=t=>S.matches.filter(m=>m.teamId===t.id).flatMap(m=>spList(m).map(sp=>({m,sp})));
function spGratisK(m){const t=teamOf(m.teamId),g=t?.spostGratis,sp=m.spostamento;if(!g||!sp||sp.stato==='rifiutata')return null;const il=spIl(sp);
  const prev=spTeamList(t).filter(x=>x.sp!==sp&&x.sp.stato!=='rifiutata'&&spIl(x.sp)<=g.entro&&(spIl(x.sp)<il||(spIl(x.sp)===il&&(x.m===m||x.m.id<m.id)))).length;
  const[k,txt]=il>g.entro?['warn',`Richiesta fatta il ${fmtD(il)}, dopo il ${fmtD(g.entro)}: è fuori dagli spostamenti gratuiti, valgono le disposizioni del comitato.`]
    :prev>=g.max?['crit',`${t.sigla} aveva già fatto ${prev} richieste: questa supera il limite di ${g.max} gratuite e potrebbe essere a pagamento.`]
    :['ok',`Spostamento gratuito: è la richiesta n. ${prev+1} di ${g.max} per ${t.sigla}, da confermare entro il ${fmtD(g.entro)}.`];
  return[k,k==='ok'?'Gratuito':'Oltre i gratuiti',txt]}
const txState=x=>x.pagata?['ok','Pagata']:x.scadenza<TODAY_ISO?['crit','Scaduta']:daysTo(x.scadenza)<=15?['warn',`Scade tra ${daysTo(x.scadenza)} gg`]:['mute','Da pagare'];
/* richieste che contano nel limite: in approvazione o approvate, fatte entro la scadenza, comprese quelle dello storico.
   skip = la richiesta che si sta modificando, che non conta contro sé stessa */
const spUsed=(t,skip)=>spTeamList(t).filter(x=>x.sp!==skip&&x.sp.stato!=='rifiutata'&&spIl(x.sp)<=t.spostGratis.entro).length;
/* richieste precedenti della gara, nella sua scheda */
const spStoricoHtml=m=>(m.spostStorico||[]).length?`<p class="hint" style="margin:8px 0 0">Richieste precedenti: ${m.spostStorico.map(s=>`${fmtD(s.il)} al ${fmtDow(s.al?.data)} ${esc(s.al?.ora||'')} · ${esc(SP_STATI[s.stato]?.[1]||s.stato)}`).join('; ')}.</p>`:'';
const spGratisTxt=t=>{const g=t.spostGratis,u=spUsed(t);return`<span class="num">${u} di ${g.max}</span> usati · entro il ${fmtD(g.entro)}${TODAY_ISO>g.entro?' '+pill('mute','Periodo finito'):u>=g.max?' '+pill('warn','Esauriti'):''}`};
function spGratisNote(m){const t=teamOf(m.teamId),g=t?.spostGratis;if(!g)return'';const u=spUsed(t,spPending(m)),left=g.max-u;
  const[k,txt]=TODAY_ISO>g.entro?['warn',`Il periodo degli spostamenti gratuiti è finito il ${fmtD(g.entro)}: valgono le disposizioni del comitato, lo spostamento potrebbe essere a pagamento.`]
    :left<=0?['crit',`${t.sigla} ha già usato ${u} spostamenti gratuiti su ${g.max}: questa richiesta potrebbe essere a pagamento.`]
    :['ok',`Spostamento gratuito: ${t.sigla} ne ha ancora ${left} su ${g.max}, da confermare entro il ${fmtD(g.entro)}.`];
  return`<p class="sp-free">${pill(k,k==='ok'?'Gratuito':'Attenzione')}<span>${esc(txt)}</span></p>`}
function formTasse(t){if(!t)return;const ro=!canTasse(t),L=t.tasse||[],g=t.spostGratis||{};
  openDrawer(`Tasse e spostamenti · ${t.sigla}`,`<fieldset><legend>Tasse gara</legend>${L.length?`<div class="checks">${L.map(x=>`<div class="tm"><label class="check"><input type="checkbox" name="paid" value="${x.id}" ${x.pagata?'checked':''}> <span><b class="num">${eur(x.totale)}</b> entro ${fmtD(x.scadenza)} <span class="meta">· ${esc(x.voce)}${x.gare?` · ${x.gare} gare × ${eur(x.unitario)}`:''}</span></span></label>${pill(...txState(x))}<label class="check"><input type="checkbox" name="del" value="${x.id}"> <span class="meta">elimina</span></label></div>`).join('')}</div>
  <p class="hint">Spunta le tasse già pagate.${L[0]?.fonte?' Fonte: '+esc(L[0].fonte)+'.':''}</p>`:'<p class="hint">Nessuna tassa caricata: si leggono dal comunicato FIPAV nella pagina Partite, riquadro Recapiti avversari.</p>'}</fieldset>
  <fieldset><legend>Spostamenti gratuiti</legend><div class="fgrid">${inp('sg_max','Richieste gratuite',g.max??'',{type:'number',min:0})}${inp('sg_entro','Da confermare entro',g.entro||'',{type:'date'})}</div>
  <p class="hint">${t.spostGratis?`Usati finora: ${spUsed(t)}. `:''}Lascia vuoto se il comitato non prevede spostamenti gratuiti. Contano le richieste in approvazione o approvate fatte entro la data.</p></fieldset>`,
  {ro,onSave:fd=>{const paid=new Set(fd.getAll('paid')),del=new Set(fd.getAll('del'));const T=L.filter(x=>!del.has(x.id)).map(x=>({...x,pagata:paid.has(x.id)}));
    if(T.length)t.tasse=T;else delete t.tasse;const mx=(fd.get('sg_max')||'').trim(),en=(fd.get('sg_entro')||'').trim();
    if(mx!==''&&en)t.spostGratis={...g,max:+mx,entro:en};else delete t.spostGratis;return'Tasse e spostamenti salvati'}})}

function bindImport(){bindDrop('#drop','#file',readFile)}
function bindDrop(dSel,fSel,cb){
  const file=$(fSel),drop=$(dSel);if(!file||!drop)return;
  file.addEventListener('change',()=>file.files[0]&&cb(file.files[0]));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)cb(f)});
}
/* SheetJS (cdnjs): circa 900 KB, si scarica solo quando serve (import ed export Excel), non all'avvio dell'app.
   Chi può importare o esportare lo riceve in anticipo, a pagina caricata (preloadXlsx) */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';let xlsxLib=null;
function loadXlsx(){return xlsxLib=xlsxLib||new Promise((ok,ko)=>{if(typeof XLSX!=='undefined'){ok(XLSX);return}
  const s=document.createElement('script');s.src=XLSX_URL;
  s.onload=()=>typeof XLSX!=='undefined'?ok(XLSX):(xlsxLib=null,ko(new Error('Libreria Excel non disponibile')));
  s.onerror=()=>{xlsxLib=null;s.remove();ko(new Error('Libreria Excel non caricata: controlla la connessione'))};document.head.appendChild(s)})}
function preloadXlsx(){if(ME&&(ME.admin||ME.giov||ME.workTeams.length))setTimeout(()=>loadXlsx().catch(()=>{}),3000)}
async function readWorkbook(f,cb){
  try{await loadXlsx()}catch(e){toast('Lettore Excel non caricato: controlla la connessione o usa l\'incolla da Excel');return}
  const r=new FileReader();r.onload=()=>{let wb;try{wb=XLSX.read(new Uint8Array(r.result),{type:'array',raw:/\.csv$/i.test(f.name)})}catch(e){toast('File non leggibile: salvalo come .xlsx e riprova');return}cb(wb)};
  r.readAsArrayBuffer(f);
}
const sheetRows=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
function readFile(f){readWorkbook(f,wb=>{UI.imp=buildImport(sheetRows(wb.Sheets[wb.SheetNames[0]]));UI.ptool='imp';UI.impName=f.name;render()})}

/* ---------- import ed export anagrafiche da Excel ---------- */
/* Ogni tipo di anagrafica descrive le sue colonne: come riconoscerle dall'intestazione (m), il tipo di dato (t),
   se sono obbligatorie per un nuovo inserimento (req) e un valore d'esempio per il modello (ex).
   Le chiavi (keys) servono a riconoscere chi è già presente, così l'import aggiorna invece di duplicare. */
const normH=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9@]+/g,' ').trim();
const isPar=h=>/genit|tutor|padre|madre|famigl/.test(h);
/* secondo genitore: "Genitore 2", "Secondo genitore", "Madre"; tutto il resto è il primo */
const isPar2=h=>/genit\w* ?2|second\w* genit|madre/.test(h),isPar1=h=>isPar(h)&&!isPar2(h);
const MH={
  full:h=>!isPar(h)&&((h.includes('cognome')&&/\bnome\b/.test(h.replace('cognome','')))||/^(nominativo|atleta|dirigente|nome e cognome)$/.test(h)),
  cognome:h=>!isPar(h)&&/^cognome\b/.test(h)&&!/\bnome\b/.test(h.replace(/^cognome/,'')),
  nome:h=>!isPar(h)&&/^nome\b/.test(h)&&!/cognome|squadr|palestr|impiant|fipav|societ|portale/.test(h),
  email:h=>!isPar(h)&&/mail|posta/.test(h),
  cell:h=>!isPar(h)&&/cell|telef|^tel\b|mobile|whatsapp|recapito/.test(h),
  tessera:h=>/tessera|matricola|tesserino/.test(h),
  teams:h=>/squadr|categori|gruppo|team/.test(h),
};
const IF=(k,l,m,o={})=>({k,l,m:typeof m==='function'?m:(h=>m.test(h)),t:o.t||'text',req:!!o.req,ex:o.ex??''});
const FULL=IF('_full','Cognome e nome (in una colonna)',MH.full,{t:'full'});
