const getP=(o,k)=>k.split('.').reduce((x,p)=>x?.[p],o);
const setP=(o,k,v)=>{const ps=k.split('.'),last=ps.pop();let x=o;ps.forEach(p=>{if(!x[p]||typeof x[p]!=='object')x[p]={};x=x[p]});x[last]=v};
/* valore di una cella → dato dell'app; undefined = cella vuota o non utilizzabile (il campo esistente non viene toccato) */
function parseCell(t,v,warn){
  const s=String(v??'').trim();if(s==='')return undefined;
  switch(t){
    case'date':{const d=cellDate(v);if(!d?.date){warn.push(`data non valida: ${s}`);return undefined}return d.date}
    case'sex':return/^f|femm|donn/i.test(s)?'F':/^m|masc|uomo/i.test(s)?'M':undefined;
    case'bool':return/^(s|si|sì|x|1|true|vero|y|yes|giov)/i.test(s);
    case'num':{const n=typeof v==='number'?v:parseFloat((s.includes(',')?s.replace(/\./g,'').replace(',','.'):s).replace(/[^\d.-]/g,''));return isNaN(n)?undefined:n}
    case'teams':{const ids=[];s.split(/[,;\/|+]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const t=S.teams.find(t=>[t.sigla,t.nome,t.fipav].some(y=>y&&norm(y)===norm(x)));
      if(!t)warn.push(`squadra non trovata: ${x}`);else if(!ids.includes(t.id))ids.push(t.id)});return ids.length?ids:undefined}
    case'roles':{const r=ROLES_DIR.map(([k])=>k).filter(k=>new RegExp(k.slice(0,5),'i').test(s));if(!r.length)warn.push(`incarico non riconosciuto: ${s}`);return r.length?r:undefined}
    case'gym':{const g=S.gyms.find(g=>norm(g.nome)===norm(s)||(g.fipav&&norm(g.fipav)===norm(s)));if(!g){warn.push(`palestra non trovata: ${s}`);return undefined}return g.id}
    case'tel':return s.replace(/\.0$/,'');
    case'maglie':{const one=s.replace(/\.0$/,'');if(/^\d{1,3}$/.test(one))return{_all:+one};const m={};
      s.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const r=x.match(/^(.*?)[\s:#n°.]*(\d{1,3})$/i),t=r&&S.teams.find(t=>[t.sigla,t.nome,t.fipav].some(y=>y&&norm(y)===norm(r[1])));
        if(t)m[t.id]=+r[2];else warn.push(`maglia senza squadra riconosciuta: ${x}`)});return Object.keys(m).length?m:undefined}
    default:return s}
}
function fmtCell(t,v){if(v==null||v==='')return'';switch(t){
  case'date':return fmtD(v);case'teams':return(v||[]).map(id=>teamOf(id)?.sigla).filter(Boolean).join(', ');
  case'roles':return ROLES_DIR.filter(([k])=>v.includes(k)).map(([,l])=>l).join(', ');
  case'bool':return v?'sì':'no';case'gym':return S.gyms.find(g=>g.id===v)?.nome||'';
  case'maglie':return Object.entries(v||{}).map(([id,n])=>id==='_all'?String(n):`${teamOf(id)?.sigla||id} ${n}`).join(', ');default:return v}}
const pickSheet=(names,kind)=>names.find(n=>KINDS[kind].sh.test(norm(n)))||names[0];
/* riga d'intestazione = tra le prime 10, quella con più colonne riconosciute */
function piDetect(){const p=UI.pi,K=KINDS[p.kind],rows=p.sheets[p.sheet]||[];let best={h:0,n:-1,map:{}};
  for(let i=0;i<Math.min(rows.length,10);i++){const map={};K.f.forEach(f=>map[f.k]=-1);let n=0;
    rows[i].map(normH).forEach((h,j)=>{if(!h)return;const f=K.f.find(f=>map[f.k]<0&&f.m(h));if(f){map[f.k]=j;n++}});
    if(n>best.n)best={h:i,n,map}}
  p.h=best.h;p.header=(rows[best.h]||[]).map(c=>String(c??'').trim());p.map=best.map;
  p.body=rows.slice(best.h+1).filter(r=>r.some(c=>String(c??'').trim()!==''))}
function parseRow(K,r,p){const o={},has=new Set(),warn=[];
  K.f.forEach(f=>{const i=p.map[f.k];if(i==null||i<0)return;
    if(f.t==='full'){const parts=String(r[i]??'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return;
      const nomePrima=/^nome/.test(normH(p.header[i]));o.nome=nomePrima?parts[0]:parts[parts.length-1];
      const cog=(nomePrima?parts.slice(1):parts.slice(0,-1)).join(' ');has.add('nome');if(cog){o.cognome=cog;has.add('cognome')}return}
    const v=parseCell(f.t,r[i],warn);if(v!==undefined){setP(o,f.k,v);has.add(f.k)}});
  return{o,has,warn}}
function piPreview(){const p=UI.pi,K=KINDS[p.kind],idx=new Map(),seen=new Set();
  S[K.coll].forEach(r=>K.keys(r).filter(Boolean).forEach(k=>idx.has(k)||idx.set(k,r)));
  return p.body.map((r,i)=>{const{o,has,warn}=parseRow(K,r,p),ks=K.keys(o).filter(Boolean);
    const target=ks.map(k=>idx.get(k)).find(Boolean)||null,err=[];
    if(!has.size)err.push('nessun dato riconosciuto');
    else if(ks.some(k=>seen.has(k)))err.push('riga duplicata nel file');
    ks.forEach(k=>seen.add(k));
    if(!target)K.f.filter(f=>f.req&&!has.has(f.k)).forEach(f=>err.push(`manca ${f.l.toLowerCase()}`));
    warn.push(...(K.pw?.(o,has,target)||[]));
    return{n:p.h+2+i,o,has,warn,err,target,st:err.length?'err':target?'upd':'new',lab:K.lab(target||o)||'—'}})}
function piApply(){const K=KINDS[UI.pi.kind];let add=0,upd=0;
  piPreview().filter(x=>x.st!=='err').forEach(x=>{const isNew=!x.target,rec=x.target||K.blank();
    x.has.forEach(k=>setP(rec,k,getP(x.o,k)));K.fin?.(rec,isNew,x.has);
    if(isNew){rec.id=uid(K.p);S[K.coll].push(rec);add++}else upd++});
  return{add,upd}}
/* modello (intestazioni + una riga d'esempio) o dati attuali, un foglio per anagrafica: lo stesso file si può reimportare */
async function exportWorkbook(withData){
  try{await loadXlsx()}catch(e){toast(e.message);return}
  const wb=XLSX.utils.book_new();
  Object.entries(KINDS).forEach(([kind,K])=>{const F=K.f.filter(f=>f.t!=='full'),rows=[F.map(f=>f.l)];
    if(withData)S[K.coll].forEach(r=>{const G=kind==='athletes'?parentsOf(r).map(parentContact):[];
      rows.push(F.map(f=>{const m=f.k.match(/^genitore(2?)\.(\w+)$/);if(m)return G[m[1]?1:0]?.[m[2]]||'';return fmtCell(f.t,getP(r,f.k))}))});
    else rows.push(F.map(f=>f.ex));
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=F.map(f=>({wch:Math.max(12,f.l.length+2)}));XLSX.utils.book_append_sheet(wb,ws,K.l)});
  try{XLSX.writeFile(wb,withData?`palleggio-anagrafiche-${TODAY_ISO}.xlsx`:'palleggio-modello-importazione.xlsx');toast(withData?'File Excel scaricato':'Modello scaricato: compila i fogli e importali da qui')}
  catch(e){toast('Download non riuscito: '+e.message)}
}
function readPeople(f){readWorkbook(f,wb=>{const sheets={};wb.SheetNames.forEach(n=>sheets[n]=sheetRows(wb.Sheets[n]));
  UI.pi={name:f.name,sheets,sheet:pickSheet(wb.SheetNames,UI.piKind),kind:UI.piKind,link:true};piDetect();render()})}

  const kids=S.athletes.filter(a=>ME.children.includes(a.id)).sort((a,b)=>a.nome.localeCompare(b.nome)),tids=[...new Set(kids.flatMap(a=>a.teams))];
  const gym=id=>S.gyms.find(g=>g.id===id),self=kids.length===1&&ME.ruoli.includes('Atleta')&&!ME.ruoli.some(r=>r.startsWith('Genitore'));
  /* prossimi 14 giorni: turni settimanali delle squadre dei figli + gare con data */
  const days=[...Array(14)].map((_,i)=>{const d=addDays(TODAY,i),di=iso(d),dw=(d.getDay()+6)%7;
    const ev=[...S.slots.filter(s=>tids.includes(s.teamId)&&s.giorno===dw).map(s=>({ora:s.inizio,fine:s.fine,t:teamOf(s.teamId),g:gym(s.gymId)})),
      ...S.matches.filter(m=>tids.includes(m.teamId)&&m.data===di).map(m=>({ora:m.ora||'',t:teamOf(m.teamId),m,g:gymOfMatch(m)}))].sort((x,y)=>x.ora.localeCompare(y.ora));
    return{di,ev}}).filter(x=>x.ev.length);
  const evHtml=e=>{const pl=e.m?matchPlace(e.m):e.g?{nome:e.g.nome,indirizzo:e.g.indirizzo}:null;return`<div class="li ag${e.m?' ag-m':''}"><span class="num ag-t">${e.d?fmtDow(e.d)+' ':''}${esc(e.ora)}${e.fine?'–'+esc(e.fine):''}</span>${chip(e.t)}<div class="grow">${e.m
    ?`<b>Gara</b> ${matchLine(e.m)}<div class="meta">${e.m.inCasa===false?'In trasferta':'In casa'} · ${esc(pl?impLine(pl):'impianto da definire')}</div>${spPending(e.m)?`<div class="sp-note">${pill('warn','Possibile spostamento')} <span>${esc(spProposta(e.m))}, in attesa di conferma</span></div>`:''}`
    :`<b>Allenamento</b><div class="meta">${esc(e.g?.nome||'')}${e.g?.indirizzo?' · '+esc(e.g.indirizzo):''}</div>`}</div>${pl?`<a class="btn sm" href="${esc(mapsUrl(pl))}" target="_blank" rel="noopener" aria-label="Apri ${esc(pl.nome||'l\'impianto')} su Maps">${I.map}Mappa</a>`:''}</div>`};
  const later=S.matches.filter(m=>tids.includes(m.teamId)&&m.data>iso(addDays(TODAY,13))).slice(0,12);
  /* in cima: il prossimo impegno (finito quello di oggi, il successivo) e la prossima gara, da aggiungere al calendario */
  const nowM=nowMin(),dur=+S.settings.durata||120,up=[];
  days.forEach(x=>x.ev.forEach(e=>{if(x.di===TODAY_ISO&&t2m(e.fine||e.ora||'23:59')+(e.m&&!e.fine?dur:0)<=nowM)return;up.push({...e,d:x.di})}));
  const nm=up.find(e=>e.m)||(later[0]&&{ora:later[0].ora,t:teamOf(later[0].teamId),m:later[0],g:gymOfMatch(later[0]),d:later[0].data});
  const card=(lbl,e)=>{const pl=e.m?matchPlace(e.m):e.g?{nome:e.g.nome,indirizzo:e.g.indirizzo}:null;
    return evCard(lbl,`${dayLbl(e.d)} · ${esc(e.ora)}${e.fine?'–'+esc(e.fine):''}`,`${chip(e.t)} ${e.m?matchLine(e.m):'Allenamento'}`,
      `${e.m?(e.m.inCasa===false?'In trasferta':'In casa')+(pl?' · ':''):''}${pl?esc(nomeSq(impLine(pl))):''}${e.m&&spPending(e.m)?' · possibile spostamento: '+esc(spProposta(e.m)):''}`,
      `${pl?`<a class="btn sm" href="${esc(mapsUrl(pl))}" target="_blank" rel="noopener">${I.map}Mappa</a>`:''}${e.m?`<button type="button" class="btn sm pri-soft" data-act="calOpen">${I.cal}Aggiungi al calendario</button>`:''}`)};
  const top=[up[0]&&card('Prossimo impegno',up[0]),nm&&nm.m!==up[0]?.m&&card('Prossima gara',nm)].filter(Boolean);
  return head(self?'La mia scheda':'La mia famiglia',`Ciao ${esc((ME.nome||'').split(' ')[0])}: certificato medico, quota, gare e allenamenti${self?'':' dei tuoi figli'}. Per correggere un dato scrivi alla segreteria.`,`<button class="btn" type="button" data-act="calOpen">${I.cal}Calendario sul telefono</button>`)+`
  ${top.length?`<div class="next" style="margin-bottom:16px">${top.join('')}</div>`:''}
  <div class="teams" style="margin-bottom:16px">${kids.map(a=>{const v=visita(a),q='quota' in a?quota(a):null,nm=S.matches.find(m=>a.teams.includes(m.teamId)&&m.data>=TODAY_ISO);
    return`<article class="team"><div class="team-h"><div class="badge" style="background:${esc(teamOf(a.teams[0])?.colore||'#888')}">${esc((a.nome[0]||'')+(a.cognome[0]||''))}</div><div style="min-width:0"><h2>${esc(fullName(a))}</h2><div class="meta">${a.teams.map(id=>esc(teamOf(id)?.nome||'')+(magliaOf(a,id)!=null?` · maglia ${esc(magliaOf(a,id))}`:'')).join('<br>')}</div></div></div>
    <dl><dt>Certificato</dt><dd>${pill(v.k,v.t)} <span class="num meta">${fmtD(a.visita?.scadenza)}</span></dd>
    ${q?`<dt>Quota</dt><dd>${pill(q.k,q.t)}${q.r?` <span class="num">resta ${eur(q.r)}</span>`:''}</dd>`:''}
    ${a.teams.map(id=>{const t=teamOf(id),c=staffOf(t?.staff?.allenatore);return t&&c?`<dt>Allenatore ${esc(t.sigla)}</dt><dd>${esc(fullName(c))}</dd>`:''}).join('')}
    <dt>Prossima gara</dt><dd>${nm?`${fmtDow(nm.data)} ${esc(nm.ora)} · ${matchLine(nm)}`:'—'}</dd></dl></article>`}).join('')||'<div class="empty">Nessun atleta collegato al tuo indirizzo email.</div>'}</div>
  <section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Prossimi 14 giorni</h2><span class="count">allenamenti e gare</span></div>
    ${days.map(x=>`<div class="wl-day"><h3>${DAYS_FULL[(parseISO(x.di).getDay()+6)%7]} ${fmtD(x.di).slice(0,5)}</h3><div class="list">${x.ev.map(evHtml).join('')}</div></div>`).join('')||'<div class="empty">Niente in programma nei prossimi 14 giorni.</div>'}</section>
  ${later.length?`<section class="panel"><div class="panel-h"><h2>Gare successive</h2></div><div class="list">${later.map(m=>evHtml({ora:m.ora,t:teamOf(m.teamId),m,g:gymOfMatch(m),d:m.data})).join('')}</div></section>`:''}`}};

function formUser(u){const n=!u;u=u||{email:'',nome:'',ruolo:'segreteria',teams:[],cell:''};
  const people=[...S.staff.map(p=>['s:'+p.id,`${fullName(p)} (staff)`]),...S.dirigenti.map(d=>['d:'+d.id,`${fullName(d)} (dirigente)`])].sort((a,b)=>a[1].localeCompare(b[1]));
  openDrawer(n?'Nuovo accesso':u.nome||u.email,`<div class="fgrid">${n?sel('copia','Copia i dati da',``,[['','— persona già in anagrafica (facoltativo) —'],...people],{wide:1}):''}${inp('nome','Nome e cognome',u.nome,{wide:1})}${inp('email','Email *',u.email,{type:'email',req:1})}${inp('cell','Cellulare (WhatsApp)',u.cell||'',{type:'tel'})}${sel('ruolo','Ruolo',u.ruolo,[['segreteria','Segreteria'],['giovanile','Responsabile settore giovanile'],['admin','Amministratore']],{wide:1})}</div>
  <label class="check u-seg" style="margin-top:10px"><input type="checkbox" name="principale" ${u.principale?'checked':''}> Riferimento principale della segreteria (primo pulsante WhatsApp)</label>
  <fieldset class="u-teams" style="margin-top:14px"><legend>Squadre di competenza</legend><p class="hint" style="margin-top:0"><span class="u-giov">Nessuna spunta = tutte le squadre segnate come giovanili, comprese quelle create in futuro.</span><span class="u-seg">Nessuna spunta = tutte le squadre. La persona riceve e approva le richieste di spostamento solo delle squadre spuntate.</span></p><div class="checks">${S.teams.map(t=>`<label class="check"><input type="checkbox" name="teams" value="${t.id}" ${u.teams.includes(t.id)?'checked':''}>${chip(t)} ${esc(t.nome)}${t.giovanile?'':' <span class="meta">(non giovanile)</span>'}</label>`).join('')}</div></fieldset>
  <p class="hint">Allenatori, dirigenti e genitori non vanno aggiunti qui: entrano con l'email delle loro schede.</p>`,
  {onSave:fd=>{const g=k=>(fd.get(k)||'').trim(),email=g('email').toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Email non valida');$('#f_email').focus();return false}
    if(S.utenti.some(x=>x!==u&&x.email.toLowerCase()===email)){toast('Questa email ha già un accesso');return false}
    const r=g('ruolo'),o={nome:g('nome'),email,ruolo:r,teams:r==='admin'?[]:fd.getAll('teams'),cell:g('cell')};
    if(r==='segreteria'&&fd.get('principale'))o.principale=true;else delete u.principale;
    if(o.principale)S.utenti.forEach(x=>{if(x!==u&&x.principale)delete x.principale});
    if(n)S.utenti.push({id:uid('u'),...o});else Object.assign(u,o);
    return r==='segreteria'&&!o.cell?'Accesso salvato: senza cellulare non riceverà le richieste su WhatsApp':'Accesso salvato'},
   onDelete:n?null:()=>{S.utenti=S.utenti.filter(x=>x.id!==u.id);return'Accesso eliminato'}});
  const vis=()=>{const r=$('#f_ruolo').value;$('#dBody').querySelectorAll('.u-seg').forEach(x=>x.hidden=r!=='segreteria');$('#dBody').querySelectorAll('.u-giov').forEach(x=>x.hidden=r!=='giovanile');$('#dBody .u-teams').hidden=r==='admin'};
  $('#f_ruolo').addEventListener('change',vis);vis();
  $('#f_copia')?.addEventListener('change',e=>{const[k,id]=e.target.value.split(':'),p=k==='s'?staffOf(id):k==='d'?S.dirigenti.find(x=>x.id===id):null;if(!p)return;
    $('#f_nome').value=fullName(p);$('#f_email').value=p.email||'';$('#f_cell').value=p.cell||''});

const TPL={
  convocazione:'Gentile famiglia, {nome} è convocato/a per la gara {prossimaGara}. Ritrovo 60 minuti prima dell\'inizio con divisa da gioco e documento. Grazie, {club}',
  visita:'Gentile famiglia, il certificato medico agonistico di {nome} scade il {scadenzaVisita}. Vi chiediamo di prenotare il rinnovo e consegnarne copia in segreteria: senza certificato valido non può allenarsi né giocare. Grazie, {club}',
  quota:'Gentile famiglia, risulta ancora da versare la quota di iscrizione di {nome}: residuo {residuo}. Potete pagare con bonifico o in segreteria. Grazie, {club}',
  gruppo:'Ciao a tutti! Prossima gara di {squadra}: {prossimaGara}. Ritrovo 60 minuti prima dell\'inizio con divisa da gioco e documento. Grazie, {club}',
  gruppoAvviso:'Ciao a tutti, questa settimana gli allenamenti di {squadra} seguono il consueto orario. Per qualsiasi necessità scrivete in privato all\'allenatore. {club}',
  avviso:'Ciao {nome}, ti ricordiamo che questa settimana gli allenamenti di {squadra} seguono il consueto orario. Per qualsiasi necessità rispondi a questo messaggio. {club}',
};
function nextGame(teamId){const m=S.matches.find(m=>m.data>=TODAY_ISO&&(!teamId||m.teamId===teamId));return m?`${matchLineTxt(m)} di ${fmtDow(m.data)} ore ${m.ora}, ${m.impianto}`:'in programma'}
const matchLineTxt=m=>`${m.casa} – ${m.ospite}`;
function varsOf(a){const q=quota(a);return{nome:a.nome,scadenzaVisita:fmtD(a.visita?.scadenza),residuo:eur(q?.r||0),squadra:a.teams.map(id=>teamOf(id)?.nome).join(', '),prossimaGara:nextGame(a.teams[0]),club:S.club.nome}}
function fillTpl(t,v){return String(t).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m)}
function recipients(){const c=UI.com,tid=c.team==='all'?'':c.team;
  if(c.tipo==='famiglie'){let L=S.athletes.filter(a=>!tid||a.teams.includes(tid));
    if(c.filtro==='visita')L=L.filter(a=>visita(a).k!=='ok');if(c.filtro==='quota')L=L.filter(a=>quota(a)?.r>0);if(c.filtro==='minori')L=L.filter(isMinor);
    /* un destinatario per ogni genitore: ognuno riceve il messaggio sul proprio telefono */
    return L.sort((a,b)=>a.cognome.localeCompare(b.cognome)).flatMap(a=>{const v=varsOf(a);if(tid){v.squadra=teamOf(tid).nome;v.prossimaGara=nextGame(tid)}
      return contactsOf(a).map(ct=>({nome:ct.nome||'—',rif:isMinor(a)?`${ct.rif.toLowerCase()} di ${fullName(a)}${ct.link?' · '+ct.link:''}`:'atleta',email:ct.email,cell:ct.cell,vars:v}))})}
  const T=tid?[teamOf(tid)]:S.teams,seen=new Set(),out=[];
  T.forEach(t=>{ROLES_STAFF.forEach(([r,l])=>{const p=staffOf(t.staff?.[r]);if(p&&!seen.has(p.id)){seen.add(p.id);out.push({nome:fullName(p),rif:l.toLowerCase(),email:p.email,cell:p.cell,vars:{nome:p.nome,squadra:t.nome,prossimaGara:nextGame(t.id),club:S.club.nome,residuo:'',scadenzaVisita:''}})}});
    S.dirigenti.filter(d=>d.teams.includes(t.id)&&!seen.has(d.id)).forEach(d=>{seen.add(d.id);const k=childrenOf(d);out.push({nome:fullName(d),rif:'dirigente'+(k.length?` · genitore di ${k.map(fullName).join(', ')}`:''),email:d.email,cell:d.cell,vars:{nome:d.nome,squadra:t.nome,prossimaGara:nextGame(t.id),club:S.club.nome,residuo:'',scadenzaVisita:''}})})});
  return out}
V.comunicazioni={html(){const c=UI.com;if(!c.msg)c.msg=TPL.convocazione;

    <label class="field"><span>Messaggio · segnaposto {nome} {squadra} {prossimaGara} {scadenzaVisita} {residuo} {club}</span><textarea id="c_msg" data-f="com.msg">${esc(c.msg)}</textarea></label>
    <p class="hint">${c.tipo==='gruppi'?'WhatsApp non permette di scrivere in un gruppo direttamente da un link. «WhatsApp» apre l\'app con il testo già scritto e scegli tu il gruppo; «Copia e apri il gruppo» copia il testo e apre il gruppo dal suo link d\'invito, dove lo incolli.':'WhatsApp apre una chat per destinatario con il testo già scritto. L\'invio massivo automatico richiede WhatsApp Business API, previsto nella versione completa.'}</p>
  </div></section>
  <section class="panel" id="reclist"></section></div>`},
  after(){this.list()},

  <div class="list">${L.map(rqRow).join('')||`<div class="empty">${all.length?'Nessuna richiesta con questi filtri.':'Nessuna richiesta di spostamento. Si preparano dalla scheda della gara o del conflitto.'}</div>`}</div></section>

/* ---------- calendario sul telefono (.ics, codice in ical.js) ----------
   un calendario per squadra e campionato e uno per gli allenamenti: abbonamento che si aggiorna da solo
   (solo su Google Sheets, link personale dato dal server, per iPhone e Outlook) oppure file da scaricare con la
   situazione di oggi, che si importa anche in Google Calendar (Google Calendar non legge i link di Apps Script) */
const CAL={link:null,only:null,err:''};
const calD=()=>({teams:S.teams,gyms:S.gyms,matches:S.matches,slots:S.slots,avversari:S.avversari||[],club:S.club,settings:S.settings});
const calTeams=()=>(ME.admin||ME.segr?S.teams.map(t=>t.id):[...new Set([...ME.workTeams,...ME.famTeams])]).filter(id=>teamOf(id));
const calUrl=f=>CAL.link?`${CAL.link.url}?cal=${CAL.link.cal}&${icsQuery(calD(),f)}`:'';
function calRow(f){const u=calUrl(f),w=u.replace(/^https?:/,'webcal:'),id=`${f.k}|${f.t}|${f.c}`;
  return`<div class="li cal-li"><div class="grow"><b>${esc(f.label)}</b>${f.k==='p'&&f.main?` <span class="meta">${esc(icsCampTitle(f.nome))}</span>`:''}<div class="meta">${f.k==='a'?`${f.n} turn${f.n>1?'i':'o'} a settimana, fino a fine stagione`:`${f.n} gar${f.n>1?'e':'a'} in calendario`}</div></div>
  <div class="actions">${u?`<a class="btn sm" href="${esc(w)}" target="_blank" rel="noopener">iPhone · Outlook</a><button class="btn sm" type="button" data-act="copy" data-text="${esc(u)}">${I.copy}Link</button>`:''}<button class="btn sm" type="button" data-act="calGet" data-id="${esc(id)}">${I.down}File .ics</button></div></div>`}
function calBody(){const T=CAL.only?[CAL.only]:calTeams(),F=icsFeeds(calD(),T);
  const how=REMOTE?`<ul class="cal-how"><li><b>iPhone · Outlook</b>: abbonamento al tuo link personale, che il telefono rilegge da solo ogni poche ore. Si aggiorna quando cambia un orario, arriva una gara nuova o viene approvato uno spostamento. Su iPhone, se il pulsante non fa nulla: Impostazioni → Calendario → Account → Aggiungi account → Altro → Aggiungi calendario sottoscritto, e incolla il link. Ogni calendario si chiama per esempio «🏐 U16F Gare · ${esc(icsClubShort(S.club))}».</li>
    <li><b>File .ics</b> (anche per <b>Google Calendar</b>): una copia della situazione di oggi. In Google Calendar si importa dal computer: Impostazioni → Importa ed esporta → Importa, scegliendo il calendario di destinazione. Reimportandolo nello stesso calendario dopo una modifica, gli eventi già presenti vengono aggiornati e non duplicati, perché ognuno ha un codice fisso. Le gare tolte dal calendario però restano e vanno cancellate a mano.</li></ul>
    ${CAL.err?`<p class="sp-free warn">${esc(CAL.err)}</p>`:CAL.link?'':'<p class="hint">Preparo il tuo link personale…</p>'}`
    :`<ul class="cal-how"><li><b>File .ics</b>: una copia della situazione di oggi. Reimportandolo nello stesso calendario dopo una modifica, gli eventi già presenti vengono aggiornati e non duplicati, perché ognuno ha un codice fisso.</li><li>Nella versione su Google Sheets c'è anche l'<b>abbonamento</b>, che si aggiorna da solo.</li></ul>`;
  const byT=T.map(tid=>{const L=F.filter(f=>f.t===tid),t=teamOf(tid);return L.length?`<h3 class="cal-h">${chip(t)} ${esc(t.nome)}</h3><div class="list cal-list">${L.map(calRow).join('')}</div>`:''}).join('');
  return`<p style="margin-top:0">Gare e allenamenti nel calendario del telefono, separati per squadra e campionato: ognuno diventa un calendario a sé, con il suo nome e colore, da mostrare o nascondere.</p>${how}
  ${byT||'<div class="empty">Nessuna gara o allenamento da aggiungere.</div>'}
  ${REMOTE&&CAL.link?`<p class="hint" style="margin-top:14px">Il link è personale: chi lo riceve vede i tuoi stessi calendari. Se l'hai condiviso per errore <button class="btn sm" type="button" data-act="calNew">Rigenera il link</button> e quelli vecchi smettono di funzionare (vanno riaggiunti).</p>`:''}`}
function formCal(only){CAL.only=only||null;openDrawer('Calendario sul telefono',`<div id="calBox">${calBody()}</div>`);if(REMOTE&&!CAL.link)calLink(false)}
const calRedraw=()=>{const b=$('#calBox');if(b&&!$('#drawer').hidden)b.innerHTML=calBody()};
async function calLink(nuovo){CAL.err='';try{CAL.link=JSON.parse(await gs('linkCalendario',getToken(),!!nuovo))}catch(e){CAL.err='Link non disponibile: '+errMsg(e)}
  calRedraw();if(nuovo&&!CAL.err)toast('Link rigenerato: aggiungi di nuovo i calendari su iPhone e Outlook')}
function calFile(id){const[k,t,c]=id.split('|'),f={k,t,c},txt=icsBuild(calD(),f,Date.now());
  const name=icsFileName(calD(),f);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('File del calendario scaricato')}catch(e){toast('Download non riuscito: '+e.message)}}

/* ---------- richiesta di spostamento gara ----------
   match.spostamento = {stato:'richiesta'|'approvata'|'rifiutata', numero, categoria, dal:{data,ora,palestra}, al:{data,ora,palestra}, motivazione, da, il}
   Il testo si invia al comitato FIPAV e alla società avversaria; quando arriva l'esito lo si registra e,
   se approvato, data, ora e palestra della gara vengono aggiornate (e restano bloccate rispetto all'import). */
function spMotivo(m){
  const r=[...matchConflicts().filter(c=>c.a===m||c.b===m).map(c=>{const o=c.a===m?c.b:c.a,who=c.shared.filter(p=>p.tipo==='staff').map(p=>p.nome);
      return`concomitanza con la gara ${o.campionato||teamOf(o.teamId)?.nome||''} delle ore ${o.ora}${who.length?` (stesso allenatore: ${who.join(', ')})`:c.venue?' (stesso impianto)':''}`}),
    ...matchSlotConflicts().filter(c=>c.m===m).map(c=>c.tipo==='gym'?`impianto non disponibile (occupato dall'allenamento ${teamOf(c.sl.teamId)?.nome||''})`:`allenatore ${c.who.join(', ')} impegnato in concomitanza`)];
  return r.length?'Indisponibilità per '+[...new Set(r)].join('; ')+'.':''}
/* il girone si aggiunge solo se non è già nel nome del campionato (nei calendari FIPAV a volte coincidono) */
const spCat=m=>{const c=m.campionato||'',g=m.girone||'';return[c,g&&!norm(c).includes(norm(g))?'girone '+g:''].filter(Boolean).join(' · ')};
const catTxt=s=>String(s||'').replace(/^(.+?) · girone \1$/,'$1');
/* chi ha chiesto: il nome; l'email solo a chi approva, se il nome non è noto */
const personName=e=>{const k=permLc(e);if(!k)return'';const u=(S.utenti||[]).find(x=>permLc(x.email)===k);if(u?.nome)return u.nome;
  const p=[...S.staff,...S.dirigenti].find(x=>permLc(x.email)===k);if(p)return fullName(p);return permLc(ME?.email)===k?ME.nome||'':''};
const spDa=m=>{const sp=m.spostamento||{};return sp.daNome||personName(sp.da)||(canApprove(m)?sp.da||'':'')};
function spText(m){const sp=m.spostamento,d=x=>x.data?`${DAYS_FULL[dowIdx(x.data)].toLowerCase()} ${fmtD(x.data)} ore ${x.ora}`:'';
  return`Oggetto: richiesta spostamento gara n. ${sp.numero||'—'} – ${catTxt(sp.categoria)}

Spett.le Comitato FIPAV e società avversaria,
la società ${S.club.nome} chiede lo spostamento della seguente gara:

N. gara e categoria: ${sp.numero||'—'} – ${catTxt(sp.categoria)}
Gara: ${m.casa} – ${m.ospite}
Dal: ${d(sp.dal)}${sp.dal.palestra?' – '+sp.dal.palestra:''}
Al: ${d(sp.al)}
Palestra: ${sp.al.palestra||sp.dal.palestra||'—'}
Motivazione: ${sp.motivazione}

Restiamo in attesa di riscontro.
Cordiali saluti
${ME?.nome||''}${ME?.nome?'\n':''}${S.club.nome}`}
/* segreteria: persone con ruolo "segreteria" in Accessi, per tutte le squadre o solo alcune; il principale
   per primo. Il server manda a staff e dirigenti nome e cellulare (non l'email), così possono scriverle.
   Il vecchio riferimento unico nei dati della società vale finché non viene trasferito in Accessi */
function segretari(teamId){
  const L=(S.utenti||[]).filter(u=>u.ruolo==='segreteria'&&(!teamId||!(u.teams||[]).length||u.teams.includes(teamId)));
  if(!L.length&&!(S.utenti||[]).some(u=>u.ruolo==='segreteria')&&S.club.segreteria){const s=S.club.segreteria,p=staffOf(s.staffId);
    return[{nome:p?fullName(p):s.nome,cell:p?.cell||s.cell||'',principale:true,teams:[]}]}
  return L.slice().sort((a,b)=>!!b.principale-!!a.principale||(a.nome||'').localeCompare(b.nome||'')).map(u=>({nome:u.nome||u.email,cell:u.cell||'',principale:!!u.principale,teams:u.teams||[]}))}
const segNames=L=>L.map(x=>x.nome).join(', ').replace(/, ([^,]*)$/,' o $1');
/* l'amministratore trasferisce in Accessi il vecchio riferimento unico della segreteria */
function migraSegreteria(){const s=S.club.segreteria;if(!s||!ME?.admin||ME.preview)return;
  if(!S.utenti.some(u=>u.ruolo==='segreteria')){const p=staffOf(s.staffId),email=String(p?.email||s.email||'').toLowerCase();
    if(!email)return;
    if(!S.utenti.some(u=>u.email.toLowerCase()===email))S.utenti.push({id:uid('u'),nome:p?fullName(p):s.nome||'',email,ruolo:'segreteria',teams:[],cell:p?.cell||s.cell||'',principale:true})}
  delete S.club.segreteria;save()}
/* richiesta nella forma breve: N. gara e categoria, dal, al, palestra, motivazione */
function spShort(m){const sp=m.spostamento,d=x=>x.data?`${fmtDow(x.data)}/${parseISO(x.data).getFullYear()} ore ${x.ora}`:'';
  return`*Richiesta spostamento gara*
N. gara e categoria: ${sp.numero||'—'} – ${catTxt(sp.categoria)}
Gara: ${m.casa} – ${m.ospite}
Dal: ${d(sp.dal)}${sp.dal.palestra?' – '+sp.dal.palestra:''}
Al: ${d(sp.al)}
Palestra: ${sp.al.palestra||sp.dal.palestra||'—'}
Motivazione: ${sp.motivazione}${ME?.nome?`
Richiesta da: ${ME.nome}`:''}`}
/* disponibilità di data, ora e palestra proposte: altre gare e allenamenti nella palestra,
   persone impegnate altrove (stesse regole delle sovrapposizioni). La gara viene provata al nuovo orario
   senza modificarla davvero */
const gymByName=n=>{const k=norm(n);return k?S.gyms.find(x=>norm(x.nome)===k||(x.fipav&&norm(x.fipav)===k))||null:null};
function spCheck(m,al){if(!al.data||!al.ora)return null;
  const dur=+S.settings.durata||120,g=gymByName(al.palestra||m.impianto),a=t2m(al.ora),d=dowIdx(al.data),gym=[],people=[];
  if(g){S.slots.filter(sl=>sl.gymId===g.id&&sl.giorno===d&&t2m(sl.inizio)<a+dur&&a<t2m(sl.fine)).forEach(sl=>gym.push(`allenamento ${teamOf(sl.teamId)?.sigla||''} ${sl.inizio}–${sl.fine}${sl.teamId===m.teamId?' (della stessa squadra)':''}`));
    S.matches.filter(x=>x.id!==m.id&&x.data===al.data&&x.ora&&x.inCasa!==false&&gymOfMatch(x)?.id===g.id&&Math.abs(t2m(x.ora)-a)<dur).forEach(x=>gym.push(`gara ${teamOf(x.teamId)?.sigla||''} ore ${x.ora} (${x.casa} – ${x.ospite})`))}
  const v={...m,data:al.data,ora:al.ora,gymId:g?.id||'',impianto:g?(g.fipav||g.nome):(al.palestra||m.impianto)},i=S.matches.indexOf(m);
  S.matches[i]=v;
  try{matchConflicts(true).filter(c=>c.a===v||c.b===v).forEach(c=>{const o=c.a===v?c.b:c.a;if(c.shared.length)people.push(`gara ${teamOf(o.teamId)?.sigla||''} ${fmtDow(o.data)} ore ${o.ora}: ${c.shared.filter(p=>p.tipo!=='ath').map(p=>p.nome).concat(c.shared.some(p=>p.tipo==='ath')?[`${c.shared.filter(p=>p.tipo==='ath').length} atlete in comune`]:[]).join(', ')}`)});
    matchSlotConflicts(al.data,true).filter(c=>c.m===v&&c.tipo==='coach').forEach(c=>people.push(`allenamento ${teamOf(c.sl.teamId)?.sigla||''} ${c.sl.inizio}–${c.sl.fine}: ${c.who.join(', ')}`))}
  finally{S.matches[i]=m}
  return{g,gym,people,ext:!g&&!!(al.palestra||m.impianto)}}
function spCheckHtml(m,al){const r=spCheck(m,al);if(!r)return'<p class="hint">Indica la nuova data e ora per verificare la disponibilità.</p>';
  const li=(k,t,x)=>`<div class="li"><span class="pill ${k}">${t}</span><div class="grow">${esc(x)}</div></div>`;
  return`<div class="list">${r.g?(r.gym.length?r.gym.map(x=>li('crit','Palestra occupata',x)).join(''):li('ok','Palestra libera',`${r.g.nome}: nessuna gara o allenamento in quella fascia`))
      :li('mute','Palestra',r.ext?'impianto esterno alla società: disponibilità non verificabile':'nessuna palestra indicata')}
    ${r.people.length?r.people.map(x=>li('crit','Persone impegnate',x)).join(''):li('ok','Persone libere','nessun allenatore, dirigente o atleta impegnato in quella fascia')}</div>
    ${r.gym.length||r.people.length?'<p class="hint">Puoi comunque inviare la richiesta: le sovrapposizioni restano segnalate e, se accettabili, si possono ignorare.</p>':''}`}
/* si modifica solo una richiesta in attesa; dopo un esito se ne prepara una nuova e quella chiusa passa nello storico */
function formSposta(m,cands=[m]){const sp=spPending(m)||{},g=gymOfMatch(m),cur=g?.nome||m.impianto||'';
  openDrawer(spPending(m)?'Modifica richiesta di spostamento':'Richiesta di spostamento',`${pickMatch('spNew',m,cands)}<p style="margin-top:0">${chip(teamOf(m.teamId))} ${matchLine(m)}</p>${spGratisNote(m)}
  <div class="fgrid">${inp('numero','N. gara',sp.numero??m.numero)}${inp('categoria','Categoria',sp.categoria!=null?catTxt(sp.categoria):spCat(m))}</div>
  <fieldset style="margin-top:14px"><legend>Dal</legend><div class="fgrid">${inp('dal_data','Data attuale *',sp.dal?.data??m.data,{type:'date',req:1})}${inp('dal_ora','Ora attuale *',sp.dal?.ora??m.ora,{type:'time',step:300,req:1})}</div></fieldset>
  <fieldset><legend>Al</legend><div class="fgrid">${inp('al_data','Nuova data *',sp.al?.data||'',{type:'date',req:1})}${inp('al_ora','Nuova ora *',sp.al?.ora||m.ora,{type:'time',step:300,req:1})}
  <label class="field wide"><span>Palestra</span><input id="f_palestra" name="palestra" list="sp_gyms" value="${esc(sp.al?.palestra??cur)}"><datalist id="sp_gyms">${S.gyms.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist></label></div></fieldset>
  <fieldset><legend>Disponibilità</legend><div id="spChk">${spCheckHtml(m,{data:sp.al?.data||'',ora:sp.al?.ora||m.ora,palestra:sp.al?.palestra??cur})}</div></fieldset>
  <fieldset><legend>Motivazione</legend><label class="field"><textarea id="f_motivazione" name="motivazione" rows="4" required aria-label="Motivazione">${esc(sp.motivazione??spMotivo(m))}</textarea></label></fieldset>
  <p class="hint">Salvando, la richiesta resta registrata sulla gara e ottieni il testo da inviare al comitato e alla società avversaria. La gara resta all'orario attuale finché la richiesta non viene approvata dalla segreteria${segretari(m.teamId).length?' ('+esc(segNames(segretari(m.teamId)))+')':''}: solo allora si sposta.</p>`,
  {ro:!canEdit('matches',m),saveLabel:'Prepara richiesta',onSave:fd=>{const g=k=>(fd.get(k)||'').trim();

    if(m.spostamento&&!spPending(m))m.spostStorico=[...(m.spostStorico||[]),m.spostamento];
    /* data e autore li conferma il server (Code.gs, timbraSpostamento_) */
    m.spostamento={stato:'richiesta',numero:g('numero'),categoria:g('categoria'),dal:{data:g('dal_data'),ora:g('dal_ora'),palestra:cur},al:{data:g('al_data'),ora:g('al_ora'),palestra:g('palestra')},motivazione:g('motivazione'),da:sp.da||ME?.email||'',daNome:sp.daNome||(sp.da?'':ME?.nome||''),il:sp.il||TODAY_ISO};
    setTimeout(()=>spView(m),60);return canApprove(m)?'Richiesta registrata: quando arriva la risposta registra l\'esito':segretari(m.teamId).some(x=>x.cell)?'Richiesta in approvazione: avvisa la segreteria su WhatsApp':'Richiesta in approvazione: inviala dal pulsante Email o WhatsApp'}});

}
function spView(m){const sp=m.spostamento;if(!sp){formSposta(m);return}const txt=spText(m),w=canEdit('matches',m),ap=canApprove(m),pend=!!spPending(m),av=avOf(m),mail=[S.club.emailFipav,av?.dir?.email].filter(Boolean).join(',');

  ${pend?`<p class="ro-note">In attesa di approvazione: la gara resta ${fmtDow(m.data)} ore ${esc(m.ora)} finché ${ap?'non registri l\'esito':'la segreteria non la approva'}.</p>`:''}
  ${spGratisView(m)}<dl class="sp-dl"><dt>N. gara e categoria</dt><dd>${esc(sp.numero||'—')} · ${esc(catTxt(sp.categoria))}</dd><dt>Dal</dt><dd>${fmtDow(sp.dal.data)} ${esc(sp.dal.ora)}${sp.dal.palestra?' · '+esc(sp.dal.palestra):''}</dd><dt>Al</dt><dd><b>${fmtDow(sp.al.data)} ${esc(sp.al.ora)}</b></dd><dt>Palestra</dt><dd>${esc(sp.al.palestra||'—')}</dd><dt>Motivazione</dt><dd>${esc(sp.motivazione)}</dd></dl>
  ${sp.stato!=='approvata'?`<h3 style="margin:16px 0 6px">Disponibilità al nuovo orario</h3>${spCheckHtml(m,sp.al)}`:''}
  <h3 style="margin:16px 0 6px">Testo per comitato e società avversaria</h3><textarea class="paste sp-txt" readonly rows="12" aria-label="Testo della richiesta">${esc(txt)}</textarea>
  ${(()=>{const L=segretari(m.teamId),wc=L.filter(x=>x.cell),fix=ME?.admin?'Aggiungila in Accessi e ruoli, con ruolo Segreteria.':'Chiedi all\'amministratore di indicarla in Accessi e ruoli.';
    return`<h3 style="margin:16px 0 6px">Segreteria</h3>${wc.length?`<div class="list">${wc.map((x,i)=>`<div class="li sp-seg"><div class="grow"><b>${esc(x.nome)}</b>${x.principale?' '+pill('ok','Principale'):''}<div class="meta">${esc(x.cell)}</div></div><a class="btn ${i?'':'pri'}" href="${esc(waUrl(x.cell,spShort(m)))}" target="_blank" rel="noopener">${I.wa}WhatsApp${wc.length>1?'':' alla segreteria'}</a></div>`).join('')}</div><p class="hint">Invia la richiesta in forma breve: n. gara e categoria, dal, al, palestra e motivazione.${L.length>wc.length?` Senza cellulare: ${esc(L.filter(x=>!x.cell).map(x=>x.nome).join(', '))}.`:''}</p>`

/* ---------- tabelle come schede su telefono: ogni cella riceve l'intestazione della sua colonna ---------- */
function labelTables(root){root.querySelectorAll('table').forEach(tb=>{const hs=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(!hs.length)return;
  tb.querySelectorAll('tbody tr:not([data-lb])').forEach(tr=>{tr.dataset.lb='1';[...tr.children].forEach((td,i)=>{if(td.colSpan>1)td.classList.add('full');else if(hs[i])td.dataset.l=hs[i];else td.classList.add('act')})})})}
new MutationObserver(()=>labelTables(document.body)).observe(document.body,{childList:true,subtree:true});

/* prova: Face ID o impronta (passkey) funzionano dentro la pagina di Google? Non salva nulla: chiede solo una passkey
   esistente; se il browser blocca risponde subito con un errore, se è permesso il telefono mostra la richiesta */
async function bioTest(btn){const box=$('#bioRes');if(!box)return;btn.disabled=true;box.hidden=false;box.innerHTML='<p class="hint">Prova in corso: se il telefono chiede Face ID, l\'impronta o una passkey, puoi annullare.</p>';
  const out=[],add=(k,v)=>out.push([k,v]),pk=typeof PublicKeyCredential!=='undefined'&&!!navigator.credentials?.get;
  /* la richiesta parte subito, dentro il tocco: i browser la permettono solo così */
  const t0=performance.now();let res=null;
  const p=pk?navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),timeout:20000,userVerification:'preferred'}}).then(()=>({ok:1}),e=>({e})):Promise.resolve(null);
  add('Dispositivo',devLabel());add('Pagina',window.top===window?'pagina principale':'dentro un riquadro di Google');add('Indirizzo dell\'app',location.hostname);add('Passkey nel browser',pk?'sì':'no');
  if(pk){try{add('Face ID / impronta sul dispositivo',(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())?'sì':'no')}catch(e){add('Face ID / impronta sul dispositivo','non verificabile ('+e.name+')')}}
  const fp=document.permissionsPolicy||document.featurePolicy;
  if(fp?.allowsFeature){add('Permesso della pagina di Google: creare',fp.allowsFeature('publickey-credentials-create')?'sì':'no');add('Permesso della pagina di Google: usare',fp.allowsFeature('publickey-credentials-get')?'sì':'no')}
  res=await p;const ms=Math.round(performance.now()-t0);let v;
  if(!pk)v=['crit','Il browser non supporta le passkey.'];
  else if(res?.ok)v=['ok','Il telefono ha usato una passkey: la biometria è permessa.'];
  else{const e=res.e;add('Risposta del browser',`${e.name} dopo ${ms} ms: ${e.message}`);
    const pol=/feature|policy|permission|not enabled|document|cross-origin|frame/i.test(e.message);
    v=pol||(e.name==='NotAllowedError'&&ms<700)||e.name==='SecurityError'?['crit','Bloccata: dentro la pagina di Google il browser non permette Face ID o l\'impronta. Su Apps Script la biometria non si può usare.']
      :e.name==='NotAllowedError'?['ok','Il telefono ha mostrato la richiesta e l\'hai annullata: la biometria è permessa e si può realizzare.']:['warn','Risultato incerto: mandami il risultato copiato qui sotto.']}
  const txt=[`Prova Face ID / impronta · ${new Date().toLocaleString('it-IT')}`,...out.map(([k,x])=>`${k}: ${x}`),`Esito: ${v[1]}`].join('\n');
  box.innerHTML=`<p class="sp-free">${pill(v[0],v[0]==='ok'?'Permessa':v[0]==='crit'?'Non disponibile':'Da verificare')}<span>${esc(v[1])}</span></p><dl class="sp-dl">${out.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
  <div class="actions" style="margin-top:8px"><button class="btn sm" type="button" data-act="copy" data-text="${esc(txt)}">${I.copy}Copia il risultato</button></div>`;btn.disabled=false}

/* ---------- eliminare con «Annulla» ----------
   Il dato sparisce subito e per 5 secondi il messaggio offre Annulla, che rimette com'erano tutti i record toccati,
   anche quelli cambiati a cascata (es. le squadre tolte alle atlete con la squadra). Nel frattempo non si invia nulla
   al foglio: annullando, il server non vede né l'eliminazione né il ripristino, che potrebbe non essere permesso
   (la segreteria elimina una gara FIPAV ma non può crearla) */
const UNDO_MS=5000;
function withUndo(fn){const before=snapshot(),msg=fn(),after=snapshot();
  const keys=[...new Set([...before.keys(),...after.keys()])].filter(k=>before.get(k)?.json!==after.get(k)?.json);
  if(!keys.length){toast(msg||'Fatto');return}
  SYNC.holdUntil=Date.now()+UNDO_MS+300;save();
  toastAct(msg||'Eliminato','Annulla',()=>{
    if(REMOTE&&SYNC.holdUntil<Date.now()){toast('Troppo tardi: l\'eliminazione è già stata salvata');return}
    for(const k of keys){const i=k.indexOf('/'),b=before.get(k);applyRecord(k.slice(0,i),k.slice(i+1),b?b.json:null)}
    SYNC.holdUntil=0;S.matches.sort(byWhen);save();render();toast('Ripristinato')},UNDO_MS)}

/* ---------- eventi ---------- */
/* messaggio con un pulsante (es. Annulla) */
function toastAct(t,label,fn,ms){const el=$('#toast'),s=document.createElement('span'),b=document.createElement('button');
  s.textContent=t;b.type='button';b.textContent=label;b.addEventListener('click',()=>{el.hidden=true;clearTimeout(toast._t);fn()});
  el.replaceChildren(s,b);el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,ms)}
function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,ms)}
function copyText(t,btn){const ok=()=>toast('Copiato negli appunti');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand('copy')}catch(e){}ta.remove();done?ok():toast(t)};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}

  reload:()=>{if(SYNC.busy||pendingChanges().length){toast('Attendi il salvataggio delle modifiche, poi riprova');sync();return}closeDrawer();boot()},
  retry:()=>boot(),
  lgBack:()=>{LOGIN.step='email';loginScreen()},
  lgResend:async()=>{try{await gs('richiediCodice',LOGIN.email);loginScreen('Se l\'indirizzo è registrato, ti abbiamo inviato un nuovo codice')}catch(e){loginScreen(errMsg(e))}},
  logout:async()=>{if(SYNC.busy||pendingChanges().length){toast('Attendi il salvataggio delle modifiche, poi riprova');sync();return}
    const t=getToken();dropPending();logoutLocal('Sei uscito.');try{await gs('esci',t)}catch(e){}},
  newUser:()=>formUser(),editUser:(el,id)=>formUser(S.utenti.find(u=>u.id===id)),
  startEmpty:()=>{const nome=$('#fr_nome').value.trim();if(!nome){$('#fr_nome').focus();toast('Inserisci il nome della società');return}
    S=blank();S.club={nome,stagione:$('#fr_stag').value.trim()||season()};start();save();toast('Società creata: aggiungi palestre e squadre')},
  startDemo:()=>{S=seed();start();save();toast('Dati di esempio caricati sul foglio Google')},
};
document.addEventListener('click',e=>{if(e.target.closest?.('[data-gpick]'))setTimeout(searchClose,0)});
document.addEventListener('click',e=>{if(e.target.closest('a'))return;const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();ACT[el.dataset.act]?.(el,el.dataset.id,e)});
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer()});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f){const[o,k]=el.dataset.f.split('.');UI[o][k]=el.type==='checkbox'?el.checked:el.value;
    if(el.id==='c_tipo'){const c=UI.com;if(c.tipo==='gruppi'&&/\{nome\}/.test(c.msg)&&Object.values(TPL).includes(c.msg))c.msg=TPL.gruppo;else if(c.tipo!=='gruppi'&&(c.msg===TPL.gruppo||c.msg===TPL.gruppoAvviso))c.msg=TPL.convocazione;render();return}(V[UI.view].list||render).call(V[UI.view])}
  if(el.dataset.map){UI.imp.map[el.dataset.map]=+el.value;render()}
  if(el.dataset.pmap){UI.pi.map[el.dataset.pmap]=+el.value;render()}
  if('psheet' in el.dataset){UI.pi.sheet=el.value;piDetect();render()}
  if('pilink' in el.dataset){UI.pi.link=el.checked;render()}});
document.addEventListener('input',e=>{const m=e.target.id.match(/^f_g_(dir|email|cell)_(\d+)$/);if(m)syncParentFields(m[2])});
document.addEventListener('change',e=>{if(e.target.id==='previewAs')previewAs(e.target.value)});
document.addEventListener('change',e=>{const i=e.target.dataset?.avlink;if(i==null||!UI.av)return;UI.av.link[i]=e.target.value;render()});
document.addEventListener('change',e=>{const id=e.target.dataset?.rqsel;if(!id)return;UI.rq.sel=e.target.checked?[...new Set([...UI.rq.sel,id])]:UI.rq.sel.filter(x=>x!==id);render()});
document.addEventListener('change',e=>{const i=e.target.dataset?.avtx;if(i==null||!UI.av)return;UI.av.tx[i]=e.target.value;render()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.set||!ME?.admin)return;S.settings[el.dataset.set]=el.type==='checkbox'?el.checked:+el.value;save();render()});
/* aggiornamenti arrivati mentre si scriveva in un filtro: applicali quando il campo perde il focus */
document.addEventListener('focusout',()=>setTimeout(()=>{if(SYNC.needRender)refresh()},0));
/* tornando all'app: data di oggi aggiornata e dati degli altri; uscendo: modifiche in attesa salvate sul dispositivo */
document.addEventListener('visibilitychange',()=>{if(document.hidden){savePending();return}checkToday();sync()});
window.addEventListener('pagehide',savePending);
/* cambio di giorno con l'app aperta: scadenze, "prossima gara" e conteggi si ricalcolano */
function checkToday(){const was=TODAY_ISO;setToday();if(TODAY_ISO!==was&&S&&!document.body.classList.contains('boot'))refresh()}
setInterval(checkToday,60e3);
window.addEventListener('beforeunload',e=>{if(REMOTE&&SYNC.ready&&(SYNC.busy||anyPending())){e.preventDefault();e.returnValue=''}});

boot();
</script>
</body>
</html>
